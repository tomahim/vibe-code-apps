- id: b3c11d61-152f-4c9b-a6dd-b1136f024462
  text: It is cheaper than reusing the same agent
- id: 9e35029f-d08f-46a2-9d7d-9ec106557039
  text: Fresh context makes the agent slower and more careful
- id: e7e719da-9e99-411e-8970-d55910e154b5
  text: The first agent is deleted after writing code
