prompt: "Why are GPUs useful for neural-network training?"
choices:
  - id: 125edbb4-37bc-41e4-ba76-ba45837b44a6
    text: "Training may revisit examples over multiple epochs and use altered versions where appropriate."
  - id: 5a0217c3-b463-43e4-85a1-9d8e49e9d59b
