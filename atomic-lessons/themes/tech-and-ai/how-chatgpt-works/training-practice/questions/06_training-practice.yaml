explanation: "Neural networks perform many array calculations that GPUs can run in parallel. This makes compute capacity a practical constraint. The dominant operations in many neural networks are large matrix and vector calculations. A GPU can carry out many parts of these calculations in parallel, speeding up both training and inference."
