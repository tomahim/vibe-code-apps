prompt: "Why does training-data preparation matter?"
choices:
  - id: 6cfdb7a1-62da-4045-87ae-2cc6acedf99e
    text: "Architecture sets the broad arrangement of computation before training."
  - id: 0f5316a7-46de-4499-8c40-c6028488b6fd
    text: "Training may revisit examples over many epochs, with altered versions."
  - id: dc7e1d6f-4563-4638-a89a-99003bb4e3ba
    text: "A batch is a group of examples used for a single weight update."
  - id: 3563eb03-3e15-4c3c-a441-4ae8e1b4d43f
    text: "Useful examples must be collected and prepared for the learning goal."
correct_choice_ids:
