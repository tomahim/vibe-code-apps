explanation: "Useful examples must be collected and prepared for the learning objective. Data quality and coverage affect the result. Imagine teaching a digit model with only neat printed numbers, then testing it on shaky handwritten notes. The training data did not cover the intended situation, so weak performance would be unsurprising."
