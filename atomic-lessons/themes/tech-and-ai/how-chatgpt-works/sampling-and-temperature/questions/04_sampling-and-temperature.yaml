explanation: "Higher temperature gives lower-ranked alternatives more chance and usually increases variation. Temperature changes how strongly decoding favors high-scored tokens. Higher temperature generally allows more variety; it does not add knowledge. Think of temperature as changing how sharp the candidate distribution is before selection. Lower settings concentrate probability on leading choices; higher settings spread more weight to alternatives."
