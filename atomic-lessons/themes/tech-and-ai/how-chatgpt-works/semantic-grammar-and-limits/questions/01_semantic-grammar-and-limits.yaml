explanation: "Wolfram proposes rules about which concepts can sensibly combine. This goes beyond the syntax that says which word orders are grammatical. Syntactic grammar can say that “the elephant traveled” has a normal English structure. Semantic grammar, in Wolfram's proposed sense, would help describe which concepts can combine into a plausible meaning: objects can move, people can buy things, and quantities can measure them."
