explanation: "Inspecting every weight does not automatically reveal a short human explanation. The network's useful behavior and our understanding of it are separate questions. Suppose a classifier correctly labels a cat photo. We could inspect all its intermediate numbers and weights, yet still struggle to answer which combination caused the final choice."
