explanation: "Helpfulness asks whether the answer serves the user's task; text prediction scores likely continuations. Predicting likely text and answering a user's request well are related but different objectives. Post-training tries to move behavior toward the latter. Predicting the most likely continuation of “The answer is” can produce a plausible sentence, but the user may need a justified answer with a certain format and level of detail. Helpfulness asks whether the response advances that task."
