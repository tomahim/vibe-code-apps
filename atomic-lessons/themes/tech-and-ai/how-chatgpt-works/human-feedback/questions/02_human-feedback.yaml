prompt: "What signal do human reviewers provide?"
choices:
  - id: f3934163-388e-4875-91c6-882f3e023b07
    text: "A model trained only to continue text may imitate unhelpful or wandering passages."
  - id: 786e1dae-74db-45d6-ae87-8c16c028ff33
    text: "Example answers can show a model what following an instruction looks like."
  - id: d4a35e7a-991a-4fa1-8344-5ec88737b6cd
    text: "A separate preference model can learn from ranked answers."
  - id: e3e88e35-38f5-424e-aa92-06661d1292ed
    text: "Human reviewers can compare or rate model outputs."
correct_choice_ids:
  - e3e88e35-38f5-424e-aa92-06661d1292ed
explanation: "Human reviewers can compare or rate model outputs. Their judgments provide a signal about which responses are preferred. Imagine showing reviewers two answers to “Explain photosynthesis to a child.” One is short and accurate; the other is needlessly technical or wrong. Their comparison says which output better serves the request."
