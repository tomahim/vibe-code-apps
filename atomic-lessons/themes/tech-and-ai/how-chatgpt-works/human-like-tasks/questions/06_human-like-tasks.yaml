explanation: "For a human-like task, a useful test is whether outputs usually match what people would say. Such agreement is empirical, not a mathematical guarantee. Suppose a digit model gets 98 of 100 ordinary handwritten examples right. That is useful evidence, though we would still test different handwriting styles and poor scans."
