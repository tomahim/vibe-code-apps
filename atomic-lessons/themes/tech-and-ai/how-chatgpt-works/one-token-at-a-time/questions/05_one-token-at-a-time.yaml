explanation: "After selecting a token, the model includes it in the context for the next prediction. Every new piece changes what can plausibly follow. Imagine the model selects “small” after “She saw a.” The next prediction is made for “She saw a small,” where nouns such as “bird” or “box” may now be more likely. If it had selected “strange” instead, the later wording could diverge."
