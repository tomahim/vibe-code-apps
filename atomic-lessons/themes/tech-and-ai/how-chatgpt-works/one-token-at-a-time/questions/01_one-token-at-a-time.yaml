prompt: "What role does a prompt play before generation begins?"
choices:
  - id: bb5badb9-9e64-4ed7-b322-b71040c20dcf
    text: "A prompt supplies the text and instructions the model can use as context."
  - id: 5881a7e5-ef6a-4ab5-ae1d-cd7c86272608
    text: "At each step, a language model estimates which text piece could come next."
  - id: 44f4e736-c68c-4d11-90a3-e023b4e1324a
    text: "A token can be a whole word, part of a word, punctuation, or another text piece."
  - id: 1b6a92a2-1c4b-4a8a-8e1f-53ce5f0e52b7
    text: "The model gives many candidate next tokens different scores that become probabilities."
correct_choice_ids:
  - bb5badb9-9e64-4ed7-b322-b71040c20dcf
explanation: "A prompt supplies the text and instructions the model can use as context. The model continues from that context rather than starting with a finished answer."
