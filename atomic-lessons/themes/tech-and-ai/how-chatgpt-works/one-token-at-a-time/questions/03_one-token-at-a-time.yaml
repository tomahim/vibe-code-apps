explanation: "A token can be a whole word, part of a word, punctuation, or another text piece. Calling the process “next-word prediction” is a helpful simplification. For example, a tokenizer might split an uncommon name into several pieces while keeping a common word as one piece. Punctuation and leading spaces can also be represented separately or together, depending on the tokenizer."
