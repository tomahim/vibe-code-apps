explanation: "A later word may depend on a much earlier one. Looking only at an immediate neighbor misses some useful relationships. In “The scientist who wrote the report said she would revise it,” the word “she” may relate to “scientist,” several words earlier. A model using only the immediately preceding word would miss that relationship."
