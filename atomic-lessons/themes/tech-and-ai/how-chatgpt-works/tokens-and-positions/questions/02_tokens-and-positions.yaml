prompt: "Does a token ID's numerical size express its meaning?"
choices:
  - id: 0083518f-81ff-4db4-a102-bdf97fead318
    text: "Tokenization divides input text into model-sized pieces."
  - id: 1e3c7dd7-9030-473a-88a7-f67a0134867d
    text: "An embedding table maps token IDs to learned vectors."
  - id: 879b5384-19f8-47f3-8c81-42db162bd48e
    text: "A sequence needs position information so the model can distinguish token order."
  - id: 26132f7b-b047-4a5c-b240-63980d9ad107
    text: "No. A token ID is a label; its numerical size does not encode meaning."
correct_choice_ids:
  - 26132f7b-b047-4a5c-b240-63980d9ad107
explanation: "No. A token ID is a label; its numerical size does not encode meaning. Each token in a model's vocabulary has a numerical ID. The ID identifies the token; its magnitude does not measure meaning. Imagine a vocabulary where “cat” has ID 417 and “dog” has ID 982. Those numbers are labels, like catalog numbers, rather than a scale on which 982 means “more dog.” To compare meanings, the model needs learned vectors associated with the IDs."
