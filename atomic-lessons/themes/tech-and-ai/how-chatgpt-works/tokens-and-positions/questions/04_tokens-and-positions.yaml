explanation: "A sequence needs position information so the model can distinguish token order. The essay illustrates this with GPT-2's learned position embeddings. “Dog bites man” and “Man bites dog” contain nearly the same words but have different meanings because the order changes. If the model only received a bag of token vectors, it could lose that distinction."
