explanation: "Human language contains recurring arrangements of words and phrases. Training text gives a model many examples of these regularities. A text collection contains repeated patterns such as subjects before verbs in many English statements and phrases nested inside larger phrases. A language model can learn these regularities because they help predict later tokens."
