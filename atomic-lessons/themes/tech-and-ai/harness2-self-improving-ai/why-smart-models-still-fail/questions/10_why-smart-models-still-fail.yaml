prompt: Why can't a harness simply be optimized once before deployment?
choices:
- id: 93c7f256-e0d2-4fda-9fe4-2f971ff8f66e
  text: Industry regulations forbid this kind of pre-deployment optimization work
- id: 853039c9-3f44-475d-998d-b6a16722cef8
  text: Pre-deployment search always costs more than adapting online later
- id: 5c6748e2-0f9d-4395-a211-d7542ad2e0fa
  text: Models change far too quickly for any harness to stay valid
- id: 2f57f153-1d32-4bd0-bf83-83c8460145c7
  text: A static harness picked on fixed training tasks often fails on novel tasks
correct_choice_ids:
- 2f57f153-1d32-4bd0-bf83-83c8460145c7
explanation: Offline optimization assumes tomorrow looks like the training set. In the open world, tasks are novel and a pre-picked harness often does not transfer.
