prompt: Pourquoi anticiper la position de la palanquée en fin de plongée aide-t-il
  la récupération ?
choices:
- id: 13983816-d13f-4c9a-acce-e59dfba49835
  text: Parce que le sens du courant peut être inversé (renverse) et que la dérive
    déplace les plongeurs par rapport au mouillage
- id: 335c0621-492e-479a-b678-d6218b53c59e
  text: Parce que les plongeurs remontent toujours au même endroit
- id: ec3f7415-5817-4f6e-8ae6-61ecb7705a5b
  text: Parce que le bateau ne peut pas manœuvrer
- id: 4c1dd5b6-9d84-4124-8c9a-4c85651e6deb
  text: Parce que la nuit tombe toujours en fin de plongée
correct_choice_ids:
