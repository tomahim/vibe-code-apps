explanation: Le barbotin est la couronne à empreintes du guindeau ou du cabestan où
  les maillons de la chaîne s'engrenent (p. 399). La bouée d'amarrage sur rade est
  le coffre, le pont léger est le spardeck et le passage étroit est la coursive.
