prompt: Quelles règles d'approche le manuel applique-t-il à ces organismes fixés ?
choices:
- id: b2cd3f38-700e-4a31-bdf6-5545d275d059
  text: Ne pas couper le courant qui les alimente, ne pas s'interposer entre eux et
    la lumière, approcher en douceur, éviter les lumières brusques ou intenses.
- id: 59939f99-bccc-4295-b143-68e2013e8a10
  text: Les toucher un par un pour vérifier qu'ils sont vivants.
- id: 079c3108-6ab8-42c2-9a83-765a3eb21d95
  text: Souffler des bulles dessus pour les faire sortir.
- id: cf807d7c-5a82-4996-b34b-f42cfe68c2ae
  text: Les photographier flash au maximum avant toute observation.
