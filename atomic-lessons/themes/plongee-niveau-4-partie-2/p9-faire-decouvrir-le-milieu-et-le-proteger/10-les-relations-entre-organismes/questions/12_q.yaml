prompt: Comment distinguer mutualisme et commensalisme, selon les définitions du manuel
  ?
choices:
- id: 81db3697-1312-45d5-a23a-1c73e8749690
  text: Le mutualisme est nécessaire et bénéfique aux deux ; le commensalisme profite
    à l'un sans contrepartie ni dommage pour l'autre.
- id: 4ac8173a-a9db-4709-98e6-928deee77612
  text: Le mutualisme concerne les plantes, le commensalisme les poissons.
- id: a0c088bb-31fc-49d9-b44a-6ec299f28a15
  text: Le mutualisme ne dure pas, le commensalisme est éternel.
- id: bf056e45-ce49-4e45-9bcd-2fa639639a90
  text: Le mutualisme est toujours nocif, le commensalisme jamais.
