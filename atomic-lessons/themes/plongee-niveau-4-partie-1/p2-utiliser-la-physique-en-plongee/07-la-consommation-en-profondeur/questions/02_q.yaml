  text: 'L''augmentation de volume de la cage thoracique fait baisser la pression
    : l''air est aspiré par dépression.'
- id: e36b168a-c195-44f2-a36b-5965e0ec4177
  text: Les muscles des côtes poussent l'air de la trachée vers les alvéoles.
- id: 9a07d6ac-528e-4581-9df2-498136c4bca7
