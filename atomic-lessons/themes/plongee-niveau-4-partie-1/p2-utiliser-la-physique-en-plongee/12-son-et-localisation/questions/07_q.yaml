explanation: 'Depuis les travaux de J.-D. Harris en 1973, il est admis que l''audition
  en plongée s''effectue par voie osseuse : les ondes traversent les os de la boîte
  crânienne et excitent directement les cellules sensorielles de la cochlée.'
