explanation: 'L''épreuve se fait bouteille remplie d''eau, à au moins 120 % de la
  PS sans dépasser la PE (généralement 1,5 fois la PS : par exemple 300 bars pour
  un bloc à 200 bars). L''eau n''étant pas compressible, cela évite les projections
  de métal en cas de fuite.'
