explanation: Pour un effort donné, la pression partielle de CO2 de l'air alvéolaire
  ne varie pas en fonction de la profondeur ; elle n'augmente qu'en cas d'erreur de
  gonflage ou de mauvaise épuration du CO2 dans un recycleur.
