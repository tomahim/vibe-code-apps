prompt: Que dit le manuel de la PpCO2 alvéolaire pour un effort donné ?
choices:
- id: 903a10a4-3b82-4686-9940-90d5d7e50993
  text: Elle ne varie pas avec la profondeur, sauf erreur de gonflage ou défaut d'épuration
    en recycleur.
- id: cad8cb8f-dfe2-4ee1-992b-57674b894962
  text: Elle double tous les dix mètres comme la pression absolue.
- id: 0eb66ed2-5a64-4c31-bada-b5051b44b505
  text: Elle diminue régulièrement à mesure que l'on descend plus profond.
- id: 6eb4ed55-8956-419e-b334-7174d0e24b91
  text: Elle est toujours nulle, le CO2 étant entièrement expiré.
