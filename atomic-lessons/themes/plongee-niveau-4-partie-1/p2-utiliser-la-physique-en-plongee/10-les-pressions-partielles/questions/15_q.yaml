explanation: 'Les gaz s''écoulent des plus fortes pressions partielles (ou concentrations)
  vers les plus faibles, par diffusion : l''oxygène passe des alvéoles vers le sang,
  le gaz carbonique en sens inverse, et l''azote des alvéoles vers les capillaires
  pendant la descente.'
