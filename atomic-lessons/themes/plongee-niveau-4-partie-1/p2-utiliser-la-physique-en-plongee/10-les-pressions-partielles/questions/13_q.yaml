explanation: 'Le délai de latence dépend de la pression partielle d''oxygène, de la
  sensibilité individuelle (7 minutes à 2 h 30 selon des études, pour une même personne
  !) et de facteurs favorisants : effort, fatigue, anxiété, chaleur ou froid.'
