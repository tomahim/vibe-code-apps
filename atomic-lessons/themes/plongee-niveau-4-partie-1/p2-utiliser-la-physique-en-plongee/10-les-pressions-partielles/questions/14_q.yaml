explanation: La phase d'alarme (crampes, effet tunnel, gêne ventilatoire, nausées...)
  est très rapidement réversible, mais ces signes sont souvent absents ou non perçus
  ; une fois déclenchée, la crise se déroule inexorablement, avec convulsions et risque
  de noyade.
