  text: 'Ils sont souvent absents ou non perçus : la crise peut survenir de manière
    soudaine.'
- id: 613fd10c-1bac-4b58-b3e8-5d91e612e5b8
  text: Ils sont toujours visibles au moins dix minutes avant la crise.
- id: b50df644-953f-4aa2-b693-fe3d802d8dbf
  text: Ils concernent uniquement les oreilles et les sinus du plongeur.
- id: bb05dd27-2487-41c0-88e0-2a2c6d835915
  text: Ils disparaissent dès que le plongeur cesse complètement de respirer.
