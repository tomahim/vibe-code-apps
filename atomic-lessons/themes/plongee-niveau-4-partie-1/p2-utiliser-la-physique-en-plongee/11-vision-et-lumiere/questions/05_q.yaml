prompt: De combien le masque réduit-il le champ de vision sous l'eau ?
choices:
- id: 266dbe28-0470-47be-8b17-f88f15f14fb5
  text: 'De 50 à 70 % : d''environ 180 degrés à 120-90 degrés.'
- id: f9adcc42-3a17-4900-951b-73c0ff904d6b
  text: De 10 à 20 % seulement, à peine perceptible en plongée.
- id: 08c63d00-4a2f-4e57-8aeb-aa19703d1d7f
  text: 'De 90 % : le champ se limite à quelques degrés centraux.'
- id: 8714e7e5-6fc5-4142-985e-35ce5c6af097
  text: Il ne le réduit pas, il l'élargit grâce à la réfraction.
