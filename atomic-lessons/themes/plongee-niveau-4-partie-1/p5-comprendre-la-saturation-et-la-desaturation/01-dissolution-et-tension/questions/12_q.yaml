prompt: Quelle différence le manuel fait-il entre désaturation et décompression ?
choices:
- id: 75c48862-a36a-4af7-999e-cc61f6ad67e1
  text: La décompression est la baisse de pression ; la désaturation est l'élimination
    de l'azote par le corps.
- id: 915c74b0-8859-4fd3-a21f-e0173b5be810
  text: Les deux termes désignent exactement la même chose, sans aucune distinction.
- id: 84f019af-f08c-4ae7-a8ab-c30602849fac
  text: La décompression ne concerne que les tables, la désaturation que les ordinateurs.
- id: 4980f06d-060c-4f92-b784-b8c4ba36e96c
  text: La décompression est volontaire, la désaturation est toujours accidentelle.
correct_choice_ids:
- 75c48862-a36a-4af7-999e-cc61f6ad67e1
explanation: La décompression est la phase durant laquelle la pression baisse ; elle
  peut entraîner des barotraumatismes ou des accidents de désaturation (dégazage anarchique
  de l'azote), appelés à tort « accidents de décompression ».
