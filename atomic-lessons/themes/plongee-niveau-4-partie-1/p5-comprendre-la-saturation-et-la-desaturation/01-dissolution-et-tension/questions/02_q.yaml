  text: Le gaz dissous dans un liquide est proportionnel à la pression du gaz au-dessus
    de lui.
- id: baf142ce-91c6-4345-8cac-3e3b87c161f8
  text: La quantité de gaz dissous dans un liquide ne dépend que de la température
