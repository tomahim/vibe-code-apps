prompt: Quand les bulles silencieuses deviennent-elles un risque ?
choices:
- id: 2087fe44-c515-4a16-9466-409f86304d2b
  text: Si elles grossissent, s'associent (emboles, manchons gazeux) ou passent dans
    la grande circulation via un shunt.
- id: 47625b95-b290-4349-96aa-c6918fe53a80
  text: Uniquement si le plongeur dépasse soixante mètres de profondeur pendant le
    fond.
- id: 20cc9937-9f2f-4511-8353-2235909eefa2
  text: Seulement lorsqu'elles sont produites par un appareil à recycleur.
- id: 8a104e25-a5c8-4fe6-9c0b-c841bd75eaf6
  text: 'Jamais : elles sont par définition sans aucun danger pour le plongeur.'
