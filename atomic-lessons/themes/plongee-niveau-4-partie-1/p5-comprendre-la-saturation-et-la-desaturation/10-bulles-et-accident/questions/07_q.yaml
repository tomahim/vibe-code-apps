prompt: Que sont les bulles silencieuses ?
choices:
- id: 86c2312f-57bc-4d5b-8ceb-44390d98c552
  text: Des bulles de gaz inerte en circulation veineuse, tolérées si très petites
    et peu nombreuses, évacuées par le filtre pulmonaire.
- id: a7c546f3-16a1-4b22-b919-610ab1e3baaa
  text: Des bulles qui ne produisent aucun bruit perceptible dans l'oreille du plongeur.
- id: 1d4be7f8-4e79-4977-a0dc-be084aa99cf7
  text: Des bulles d'air qui s'échappent du deuxième étage du détendeur à la remontée.
- id: 0d092ba9-9810-43e1-a9d0-8c5a7fc6e0b5
  text: Des bulles qui ne se forment jamais chez les plongeurs bien entraînés et reposés.
correct_choice_ids:
- 86c2312f-57bc-4d5b-8ceb-44390d98c552
explanation: Décrites par Haldane en 1908 (« bulles sans symptômes »), elles apparaissent
  à chaque remontée et sont tolérées tant qu'elles restent petites et peu nombreuses
  ; le filtre pulmonaire les évacue à l'expiration.
