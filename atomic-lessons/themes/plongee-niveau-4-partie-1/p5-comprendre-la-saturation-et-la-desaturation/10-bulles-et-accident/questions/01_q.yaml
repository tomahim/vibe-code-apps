prompt: Quelles sont les deux grandes catégories de modèles sur le marché, selon le
  manuel ?
choices:
- id: 261d6e25-c9b5-4840-ac53-f92e94dcb78e
  text: Ceux qui ne prennent en compte que l'azote dissous, et ceux qui ajoutent les
    germes gazeux (modèles diphasiques).
- id: 986cc18f-358c-4b7d-a0f6-720a44dcd8e9
  text: Ceux conçus pour la plongée à l'air, et ceux conçus pour la plongée au nitrox.
- id: 16b33b2a-c2b3-4fdb-a1d4-bc27f70af3ae
  text: Ceux qui calculent en mètres et en minutes, et ceux qui calculent en pieds.
- id: 5deb7aa8-b353-430f-a975-390df0217e34
  text: Ceux qui s'appuient sur des tables, et ceux qui n'utilisent aucun calcul.
