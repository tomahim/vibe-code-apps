prompt: Quel sigle (ou nom) désigne la persistance, chez l'adulte, de la communication
  entre cœurs droit et gauche présente chez l'embryon ?
accepted_answers:
- fop
- foramen ovale perméable
- foramen ovale permeable
- le fop
- foramen perméable
explanation: Le FOP (foramen ovale perméable) concerne 25 à 35 % des individus ; fermé
  en temps normal, il peut s'ouvrir en cas de surpression du cœur droit et laisser
  passer des bulles vers la circulation artérielle.
