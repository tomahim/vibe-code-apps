prompt: Quel terme le manuel n'emploie-t-il PAS pour décrire l'état d'un compartiment
  qui se charge ?
choices:
- id: 33ba21f9-429c-4c34-92e3-8b7df1ccbed2
  text: Sous-saturation - le manuel parle de charge et de décharge.
- id: 3273e160-793c-414f-bd0b-554a5ecfd605
  text: Charge - c'est exactement le terme employé par le manuel.
- id: f7a6cb89-e413-42c1-aab1-ff1ab8548a59
  text: Saturation - qui décrit, elle, l'état d'équilibre atteint.
- id: 07c9bfe3-c3bc-4a04-9b2f-6863a79b8fbf
  text: Sursaturation - qui décrit l'état où l'azote quitte le corps.
correct_choice_ids:
