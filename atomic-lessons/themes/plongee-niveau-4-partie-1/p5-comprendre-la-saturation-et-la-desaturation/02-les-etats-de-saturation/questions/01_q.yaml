prompt: Quelles sont les trois situations possibles d'un compartiment face à l'azote
  ?
choices:
- id: bd736804-c504-48c5-950e-1deb699b72b3
  text: En charge (TN2 < PpN2), saturé (TN2 = PpN2), en sursaturation (TN2 > PpN2).
- id: d934014a-0967-4a08-a447-05f7359e87c5
  text: Vide, à moitié plein, ou complètement plein, comme une bouteille de plongée.
- id: eded6215-d399-4317-897e-49189cbd6cb7
  text: Actif, en veille, ou bloqué, selon l'état du détendeur du plongeur.
- id: b715bafa-0a83-481e-b25b-3ddc88f0bb6b
  text: Froid, tiède, ou chaud, selon la température de l'eau de mer.
