prompt: Que sont la perfusion et la diffusion, selon le manuel ?
choices:
- id: 37527b8b-6cd9-4df8-82d2-1e77bd4d3e8c
  text: La perfusion est le transport du gaz par le sang ; la diffusion est le passage
    du gaz entre le sang et les tissus.
- id: 01dd7c11-c080-4f32-9292-37dab8ad7f99
  text: La perfusion est la respiration ; la diffusion est la circulation du sang.
- id: 86cfb1e1-e816-41d0-bc6b-6e2f803e74bf
  text: La perfusion est l'élimination de l'azote ; la diffusion est son absorption.
- id: 2fa1d0b6-c1d1-4635-8673-5943f2450f7e
  text: Les deux termes désignent exactement le même phénomène physiologique.
