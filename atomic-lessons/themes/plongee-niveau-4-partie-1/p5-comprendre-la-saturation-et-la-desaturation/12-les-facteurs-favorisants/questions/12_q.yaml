explanation: Pas d'altitude dans les 12 heures suivant une plongée (par exemple pour
  skier) ; ce délai peut être raccourci avec des tables spécifiques (Ski Bühlmann,
  Hahn) ou un ordinateur indiquant l'altitude maximum autorisée.
