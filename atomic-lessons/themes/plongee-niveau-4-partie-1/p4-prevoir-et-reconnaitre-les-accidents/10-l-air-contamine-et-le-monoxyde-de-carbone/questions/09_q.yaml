explanation: Les hautes températures de compression et la nécessité d'un air respirable
  obligent à utiliser des huiles spécifiques (minérales ou synthétiques), faiblement
  présentes dans l'air produit et faiblement toxiques ; leur niveau se contrôle avant
  chaque utilisation.
