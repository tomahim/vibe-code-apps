explanation: L'OHB en caisson augmente l'apport d'oxygène dissous, qui agit directement
  sur les tissus ; elle se justifie en cas de déficit respiratoire (surpression pulmonaire,
  intoxication au CO) ou de manque d'apport sanguin (accident de désaturation).
