explanation: 'Le CO se combine de manière stable - indissociable à la pression atmosphérique
  - avec l''hémoglobine sur les mêmes sites que l''O2 : le transport de l''oxygène
  est bloqué, ce qui conduit à l''hypoxie, voire rapidement à l''asphyxie.'
