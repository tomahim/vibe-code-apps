prompt: Quels matériaux composent une cartouche filtrante, selon le manuel ?
choices:
- id: fc0eb387-3a5d-4dfe-8636-1bd6b86b9aea
  text: Charbon activé pour l'huile et les odeurs, feutre pour les poussières, tamis
    moléculaire ou gels de silice pour l'humidité.
- id: e79fb12f-47f5-46b8-9471-8220a3de8146
  text: Uniquement du papier filtre, identique à celui utilisé dans les moteurs de
    voiture.
- id: 01e8bee4-a810-4ac0-8bac-3a6f907fefeb
  text: De la chaux sodée pour piéger l'azote, et de petits graviers pour retenir
    l'humidité.
- id: dcc3b4a5-8929-45d0-a1e2-d35735924367
  text: De la laine de verre et du sable très fin, qui retiennent ensemble toutes
    les impuretés.
