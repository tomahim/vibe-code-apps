prompt: Comment le plongeur doit-il agir face à une suspicion d'accident grave de
  plongée ?
choices:
- id: c302f6f3-fec9-40f5-b359-683c34057a7a
  text: Conformément à sa formation en secourisme (RIFAP, CAFSAN, PSCI, PSE1...),
    la procédure étant identique pour toute suspicion d'accident grave.
- id: 084862e5-73eb-405b-8bb3-b1d12ccfb4ad
  text: En improvisant des gestes adaptés à chaque type d'accident, car chaque procédure
    est différente.
- id: 90b69584-8482-44ef-9163-e1821701f112
  text: En attendant l'arrivée d'un médecin, seul habilité à entreprendre le moindre
    geste.
- id: d575ac5c-5fa3-451f-b880-b1c1f676c7eb
  text: En se contentant d'allonger la victime, le reste ne relevant pas des plongeurs.
