explanation: La procédure de secours est identique pour toute suspicion d'accident
  grave (ADD, surpression pulmonaire) ; on agit conformément à sa formation en secourisme
  (RIFAP, CAFSAN, PSCI, PSE1...). Sa qualité et sa précocité augmentent les chances
  d'absence de séquelles.
