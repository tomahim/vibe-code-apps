explanation: 'Selon les causes et conséquences de l''accident : CIA (séquelles lourdes),
  CIR (légères séquelles, cause évitable - réduire la profondeur, paliers à l''oxygène
  par exemple), ou CIT (quelques semaines à plusieurs mois, dans l''attente d''une
  guérison complète).'
