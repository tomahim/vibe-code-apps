prompt: Comment l'oxygène est-il administré, selon le manuel ?
choices:
- id: d885a9d2-416e-463c-9224-edce37cd8ffe
  text: À 100 %, débit 15 l/min, en inhalation si la victime ventile, en insufflation
    sinon.
- id: bb4ea350-146d-401e-931e-7fd63a59d0c1
  text: À 21 % seulement, pour éviter tout risque d'intoxication à l'oxygène en surface.
- id: 5baafae0-e659-4a58-85fb-4dbdcecfdde0
  text: Uniquement par petites bouffées de deux minutes, espacées de longues pauses.
- id: 06ae5696-f3ed-4782-98e0-dc8283f4d27b
  text: À 100 %, mais seulement après l'arrivée des secours médicalisés sur les lieux.
