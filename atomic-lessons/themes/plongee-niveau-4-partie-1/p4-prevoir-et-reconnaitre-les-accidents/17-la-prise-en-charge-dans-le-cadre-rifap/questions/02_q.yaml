explanation: 'Oxygène à 100 %, 15 litres/minute, en inhalation ou en insufflation
  selon la ventilation : cela maintient en vie les tissus peu ou mal irrigués (cellules
  nerveuses en particulier) et facilite l''élimination de l''azote en excès.'
