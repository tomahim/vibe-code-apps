prompt: Pourquoi l'administration d'oxygène est-elle si importante dans la prise en
  charge ?
choices:
- id: c1b488f0-ed39-4be6-9ac7-0579cd3e0539
  text: Elle maintient en vie les tissus peu ou mal irrigués, notamment les cellules
    nerveuses, et facilite l'élimination de l'azote.
- id: ced83054-9b0d-4ced-8159-acd4d682bc3b
  text: Elle sert uniquement à rassurer la victime, sans aucun effet physiologique
    réel.
- id: 2d726dfd-09ad-4e1a-a02d-0cb3e95107ea
  text: Elle permet de dissoudre mécaniquement les bulles par simple pression du gaz.
- id: bc00cfbc-985d-4eee-b442-b474f7abd34a
  text: Elle remplace avantageusement l'évacuation vers un centre hyperbare.
