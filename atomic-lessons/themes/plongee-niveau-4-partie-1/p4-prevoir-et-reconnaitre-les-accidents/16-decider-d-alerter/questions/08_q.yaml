explanation: 'En VHF-ASN : sélection du message, appui maintenu sur Distress jusqu''à
  entendre cinq bips courts suivis d''un long, attente de l''accusé de réception,
  puis passage du message en mode émission (PTT) : signes, nombre de victimes, secours
  apportés.'
