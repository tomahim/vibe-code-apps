prompt: Face à « quelque chose d'anormal » après une plongée (grande fatigue inhabituelle,
  par exemple), que recommande le manuel ?
choices:
- id: 676615c6-bc8c-4381-97cc-d8e70d9ce4d6
  text: Agir comme si un accident était déclaré, sans tenter de poser soi-même un
    diagnostic.
- id: 7fc12b8c-a955-4843-8eaa-6238e18473cf
  text: Attendre au moins une heure pour vérifier que les signes persistent vraiment.
- id: b11be1d6-2533-4f65-8317-a3824be7b30c
  text: Faire voter les membres de la palanquée avant de décider d'alerter.
- id: d9f08e4b-6b24-4796-b9ab-9e0071bf8d81
  text: Ne rien entreprendre tant que la victime peut encore parler et marcher.
correct_choice_ids:
- 676615c6-bc8c-4381-97cc-d8e70d9ce4d6
explanation: 'Lorsque les symptômes s''installent progressivement, le plongeur hésite
  à en parler. Dès la constatation de quelque chose d''anormal, il faut agir comme
  si un accident était déclaré : la qualité et la précocité des actes augmentent grandement
  les chances d''absence de séquelles.'
