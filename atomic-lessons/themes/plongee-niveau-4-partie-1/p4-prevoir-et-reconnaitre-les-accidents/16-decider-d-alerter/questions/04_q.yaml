prompt: Une victime présente des nausées et des vomissements après la plongée. Que
  dit l'aide à la décision du manuel ?
choices:
- id: 89f4d60f-2372-4481-bb7b-f48eae52e46c
  text: 'Si la certitude d''un mal de mer est acquise : mise en observation ; sinon
    : déclenchement des secours.'
- id: a5ecb270-3632-496c-851e-cef4c094b26e
  text: 'Les vomissements ne sont jamais un signe d''accident de plongée : aucune
    action n''est nécessaire.'
- id: 7e2f7b22-dfe6-48c0-b856-66a0e5978d2b
  text: Il faut faire boire immédiatement un litre d'eau salée pour provoquer le rejet
    complet.
- id: 0fa157bd-390e-48d7-ade2-083d06d50ec0
  text: Il faut attendre six heures d'observation avant d'envisager le moindre appel
    aux secours.
correct_choice_ids:
- 89f4d60f-2372-4481-bb7b-f48eae52e46c
explanation: 'Devant des nausées/vomissements, une seule question : certitude d''un
  mal de mer ? Si oui, mise en observation ; si non, déclenchement des secours. En
  l''absence de certitude, la prudence commande d''alerter.'
