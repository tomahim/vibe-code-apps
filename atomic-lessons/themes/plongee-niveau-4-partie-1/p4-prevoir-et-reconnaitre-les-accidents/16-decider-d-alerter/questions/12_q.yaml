after_card_position: 8
prompt: Chez qui le Code du sport place-t-il la responsabilité de la procédure de
  déclenchement des secours ?
choices:
- id: 892d4e20-652b-4df5-8bd1-d8dbffc8e75a
  text: Sous la responsabilité du directeur de plongée, jusqu'à l'arrivée des secours
    médicalisés.
- id: f8d3a0bc-92e9-46c7-ba95-82a4ab2d585a
  text: Sous la responsabilité exclusive du plongeur le moins diplômé de la palanquée.
- id: 1aab01ca-28d8-4eb8-9d23-5c0c358ab972
  text: Sous la responsabilité du fabricant du gilet de stabilisation de la victime.
- id: 53223a6d-b6b2-4f95-b7c1-1edb9a544dce
  text: Sous la responsabilité du capitaine du navire le plus proche aperçu à l'horizon.
correct_choice_ids:
- 892d4e20-652b-4df5-8bd1-d8dbffc8e75a
explanation: Selon l'article A322-72 du Code du sport cité par le manuel, le directeur
  de plongée réalise ou fait réaliser, par des personnes compétentes, le sauvetage,
  l'alerte et les premiers secours exigés par l'état de la victime, jusqu'à l'arrivée
  des secours médicalisés.
