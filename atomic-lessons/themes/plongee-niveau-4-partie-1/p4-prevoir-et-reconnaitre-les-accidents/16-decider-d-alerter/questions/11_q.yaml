prompt: Qu'est-ce que le plan de secours, selon le manuel ?
choices:
- id: 0f955a32-dd55-495d-a340-7f430f585f3f
  text: Un document écrit, adapté au lieu et à la plongée, mis à jour et porté à la
    connaissance du DP, des encadrants et des plongeurs autonomes.
- id: 58674ccd-d6ab-4512-9c84-e2e6b08c4cb6
  text: Un schéma décoratif affiché dans le club-house, que personne n'a jamais besoin
    de relire.
- id: 7eb66455-ba57-4467-bad0-9d0d29646da8
  text: Un contrat d'assurance privé que chaque plongeur signe une fois pour toutes
    à l'inscription.
- id: 37b812a6-3fcb-48d4-936f-f05415ec5172
  text: Un fichier informatique confidentiel, accessible uniquement au président de
    la structure.
