prompt: Pourquoi l'hyperventilation avant l'apnée est-elle mortelle ?
choices:
- id: d061e78f-a9c6-410d-a184-748efb34eb13
  text: Elle abaisse anormalement le CO2 artériel et repousse le seuil de rupture
    d'apnée après le seuil de syncope hypoxique.
- id: 88fc3031-52ed-4813-a794-bdf610b4bd1d
  text: Elle sature le sang en oxygène, ce qui provoque une crise d'hyperoxie immédiate.
- id: a7579e3d-301b-49da-9ec6-73eba419086f
  text: Elle contracte les muscles respiratoires, incapables ensuite de reprendre
    le souffle.
- id: e7e126d7-eaf8-46ad-9ae7-e08670114a4a
  text: Elle refroidit les poumons, ce qui déclenche un choc thermique à l'immersion.
