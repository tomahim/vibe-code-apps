prompt: Quel est le risque d'hypoxie spécifique des plongées au trimix ?
choices:
- id: a2175953-0d21-4587-af41-9e3de9997506
  text: Le mélange de fond ne peut être respiré qu'à partir d'une profondeur où sa
    PpO2 est suffisante.
- id: 87db0b46-926d-44d2-971c-ab2e175a064d
  text: L'hélium du mélange bloque totalement l'absorption de l'oxygène par le sang.
- id: 150ec409-095a-4c21-925f-53284457fe0f
  text: Le trimix provoque une syncope systématique dès la mise à l'eau.
- id: 1accd8f7-dd96-4572-9b57-b86611b21fc3
  text: Le trimix supprime toute sensation d'essoufflement, même au repos.
