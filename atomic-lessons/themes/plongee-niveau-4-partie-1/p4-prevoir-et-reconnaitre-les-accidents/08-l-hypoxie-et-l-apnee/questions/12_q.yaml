prompt: Où et quand une syncope d'apnée se produit-elle le plus souvent ?
choices:
- id: 812d96ef-fa77-405a-bef1-2eccab846b4e
  text: Lors de la remontée, à l'approche de la surface, ou après le retour en surface,
    généralement dans les 30 secondes.
- id: e4172788-6d52-4159-a7a9-7ce235b7c1f4
  text: Uniquement au fond de la piscine ou de la fosse, au moment précis de l'arrêt
    de la nage.
- id: 311b6b53-93f1-4bb1-8209-b6a56c01801d
  text: Uniquement dans la toute première minute qui suit le début de l'apnée.
- id: 3680ca7e-555d-4669-bebc-f779083bbc90
  text: Uniquement pendant la nuit qui suit la séance, au cours du sommeil.
correct_choice_ids:
- 812d96ef-fa77-405a-bef1-2eccab846b4e
explanation: La personne en sécurité doit être particulièrement vigilante à l'approche
  de la surface et dans les secondes qui suivent l'arrivée en surface.
