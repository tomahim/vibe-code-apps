prompt: Que faire dès l'arrivée en surface avec une victime de syncope ?
choices:
- id: cbbfbdbe-766b-4bc8-8bc9-16b756762497
  text: Lui maintenir les voies aériennes hors de l'eau, avertir les secours par le
    signe de détresse, la stimuler par la voix en la secouant.
- id: 4a96a429-bd5d-4d13-9e25-86a59dbd3552
  text: La laisser flotter sur le dos sans la toucher, le temps qu'elle reprenne conscience.
- id: 96d3e7cb-014c-4b55-82f0-55039659a531
  text: Lui remettre immédiatement un détendeur en bouche et le purger.
- id: 8b77400b-4ff3-4796-a46b-e474b1d8eeaa
  text: Lui faire boire une boisson chaude et sucrée en petite gorgées.
