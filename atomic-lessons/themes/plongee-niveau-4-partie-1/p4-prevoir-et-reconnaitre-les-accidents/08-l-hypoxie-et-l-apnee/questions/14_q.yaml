  text: Jamais seul, sécurité vérifiée, ne jamais dépasser ce qui est annoncé, travailler
    aux sensations, se méfier de l'hyperventilation.
- id: 4c031d11-ee8e-47b4-953f-7afab94b714f
  text: Toujours plonger seul, afin d'éviter de distraire les autres apnéistes présents.
- id: f81e2a1f-6273-4df9-ba73-f9570bb8bdde
  text: Toujours dépasser légèrement l'objectif annoncé, afin de progresser plus vite.
- id: 713750df-7dd5-435d-9327-a0bba624d94d
  text: Toujours s'entraîner à la montre et au profondimètre, pour tout mesurer précisément.
