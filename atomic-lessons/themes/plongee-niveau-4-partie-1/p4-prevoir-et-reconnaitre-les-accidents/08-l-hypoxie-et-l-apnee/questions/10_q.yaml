prompt: Quels signes pré-syncopaux le manuel cite-il sur soi ?
choices:
- id: aa23cfee-afdd-4877-b175-29eea8a82acb
  text: Bien-être inhabituel, forte soif d'air, lourdeur et chaleur des cuisses, picotements,
    vertiges, troubles visuels, tremblements.
- id: 0a02cbf7-b31e-4897-bd9d-de825f6ec8e5
  text: Des maux de tête violents, un saignement de nez et une douleur aiguë des sinus.
- id: 51fd8131-a81d-48dc-9c84-4ddc059df431
  text: Une faim intense, une soif de boisson sucrée et des crampes abdominales.
- id: ed499503-dc3d-43bd-a225-433fe1e56a1e
  text: Une douleur thoracique très précise et bien localisée du côté gauche de la
    poitrine.
