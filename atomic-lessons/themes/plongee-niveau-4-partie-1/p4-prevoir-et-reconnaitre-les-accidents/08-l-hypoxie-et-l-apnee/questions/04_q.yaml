prompt: D'où peut provenir le risque d'hypoxie en recycleur ?
choices:
- id: e86a7fb0-0820-4df6-b65e-71641dd6d632
  text: D'un défaut d'apport d'oxygène ; l'utilisation d'une ou plusieurs oxyjauges
    permet de prévenir ce risque.
- id: 49593c24-64ad-413b-a25e-35793cd85969
  text: D'un excès de chaux sodée, qui absorbe aussi l'oxygène du mélange.
- id: 363b72da-79ea-4a26-bd8c-615b1230ab52
  text: De l'azote du gaz expiré, qui devient toxique quand il est recyclé.
- id: 62c6c7c6-43b2-4fec-a646-cf844ed965dc
  text: De la condensation d'eau dans les tubulures, qui bloque l'inspiration.
correct_choice_ids:
- e86a7fb0-0820-4df6-b65e-71641dd6d632
explanation: 'Circuits semi-fermés ou fermés : dans les deux cas, un défaut d''apport
  d''oxygène peut provoquer l''hypoxie ; l''oxyjauge renseigne et alerte sur la quantité
  d''O2 du mélange inspiré.'
