  text: La théorie lipidique (gonflement des membranes des cellules nerveuses) et
    la théorie protéique (fixation des gaz inertes sur les protéines des neurones).
- id: c2db6d22-d552-4b91-b43d-c2716d354a9e
  text: La théorie de l'écrasement alvéolaire à la remontée et la théorie de l'embolie
