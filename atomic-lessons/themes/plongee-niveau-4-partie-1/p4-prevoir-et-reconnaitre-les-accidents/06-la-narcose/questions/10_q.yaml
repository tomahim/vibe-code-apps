explanation: 'Liste non exhaustive du manuel : susceptibilité individuelle (variable
  d''un jour à l''autre), vitesse de descente, fatigue et stress, conditions (pleine
  eau, retournement brusque au-delà de 30 m, froid, eau trouble, manque de lumière),
  effort (CO2), médicaments.'
