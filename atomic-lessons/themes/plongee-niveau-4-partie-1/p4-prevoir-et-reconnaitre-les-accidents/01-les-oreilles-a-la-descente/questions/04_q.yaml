prompt: Quels signes accompagnent généralement une perforation du tympan ?
choices:
- id: bb747345-f3bb-4335-a88a-58c81fdc80fd
  text: Une forte douleur, parfois des saignements et des acouphènes ; certains cas
    présentent une surdité temporaire, voire des vertiges.
- id: 2d312fc9-898e-4261-ae17-dbb42ad7067c
  text: Une douleur absente mais un écoulement de liquide clair par le nez pendant
    plusieurs jours.
- id: 2618decb-48de-419b-bc49-be0fe1a74746
  text: Uniquement une légère gêne qui disparaît dès que le plongeur atteint le fond.
- id: be6483cd-698e-478b-ab07-8eaf0bac1b66
  text: Une perte de connaissance immédiate suivie de convulsions généralisées.
