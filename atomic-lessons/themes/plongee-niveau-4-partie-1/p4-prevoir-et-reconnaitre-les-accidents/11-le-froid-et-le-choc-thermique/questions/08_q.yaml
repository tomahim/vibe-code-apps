explanation: 'Le guide observe sa palanquée indépendamment des signes effectués :
  un plongeur qui a froid peut se désintéresser de la plongée (l''esprit ailleurs,
  impatient de remonter), se recroqueviller, et trembler aux lèvres et aux bras.'
