- id: f252397b-344c-42c8-a33b-bcb94d391c68
  text: Pour améliorer l'hydrodynamisme du plongeur et sa vitesse de nage en immersion.
- id: 293f95cd-4a57-4562-aed9-622bd68ad6f4
  text: Pour empêcher totalement l'eau de mer d'entrer en contact direct avec la peau.
- id: 601343f2-610e-450a-a46e-8c59a2b15054
  text: Pour réduire le volume global de la combinaison, et donc le poids de lestage
