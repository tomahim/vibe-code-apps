- id: f4d89cf7-493e-40ba-9fc1-b8c12d351baf
  text: Boire un peu d'alcool chaud juste avant l'immersion, afin de se réchauffer.
- id: ed28fbdc-19cc-461b-aeab-47533adec52f
  text: Uniquement des protéines maigres, en évitant soigneusement tout sucre et toute
    graisse.
