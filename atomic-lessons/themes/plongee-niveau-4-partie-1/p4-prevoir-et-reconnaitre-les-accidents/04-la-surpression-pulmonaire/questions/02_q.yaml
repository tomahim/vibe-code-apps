prompt: Quel est le mécanisme de la surpression pulmonaire ?
choices:
- id: 43f4897f-5468-498d-853c-4252adf87bc5
  text: À la remontée, l'air des poumons se dilate ; s'il ne s'évacue pas, la pression
    monte dans les alvéoles, lèse la barrière alvéolo-capillaire et l'air passe dans
    la circulation.
- id: e9cb5b13-3cdf-4d4c-9dbe-dac99e726968
  text: À la descente, l'air des poumons se comprime fortement jusqu'à faire éclater
    les bronchioles terminales une à une.
- id: c36fce5d-3a82-4933-8591-72c39dae8b70
  text: Au palier, l'azote forme des poches de gaz qui viennent comprimer le cœur
    et la trachée pendant toute la remontée.
- id: 9dc7e82c-6717-42f9-a00e-0b621e54d2cc
  text: En surface, l'air froid contracte brutalement les poumons et déchire la plèvre
    dès le premier effort.
