  text: Le 18, qui coordonne systématiquement toutes les plongées en mer.
- id: a9c3c8f1-abe0-4cb5-b2bd-bae578c97ed8
  text: Le médecin traitant de la victime, seul habilité à déclencher l'évacuation.
