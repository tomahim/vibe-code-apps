  text: 'Faux : en cas de remontée rapide, il faut insister sur l''expiration ; se
    contenter de ne pas bloquer peut être insuffisant.'
- id: 366951ce-d477-4eb2-a9e3-98d2cc02542a
  text: 'Vrai : il suffit de garder la glotte grande ouverte pendant toute la durée
    de la remontée.'
- id: fa7a651e-2112-4783-a733-728324cd70c9
  text: Vrai, mais cette règle vaut uniquement pour les plongeurs expérimentés et
    bien entraînés.
- id: c38d2af4-d378-42db-b724-271b81185599
  text: 'Faux : il faut au contraire bloquer sa respiration dans les tout derniers
    mètres avant la surface.'
