prompt: Comment le guide prévient-il le placage de masque chez un plongeur peu expérimenté
  ?
choices:
- id: 2a96602e-18e1-4bdb-bc79-574c4c9fd39b
  text: Il observe le visage du plongeur dans le masque pendant la descente et, si
    nécessaire, lui demande de souffler par le nez.
- id: d086487c-49b6-4d95-8fb6-5a2490659f42
  text: Il lui prête son propre masque, toujours mieux adapté aux débutants.
- id: a504e6c5-0925-4772-8b16-b4aa43b6f79e
  text: Il lui fait retirer le masque au fond pour vérifier qu'il n'y a pas d'hématome.
- id: 89512d32-33ab-4c86-ac6e-8bc485500b31
  text: Il lui demande de serrer la sangle du masque au maximum avant la mise à l'eau.
