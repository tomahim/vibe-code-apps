prompt: À quel mécanisme le manuel relie-t-il le placage de masque et les barotraumatismes
  des sinus ?
choices:
- id: b1dc06ea-e0d5-4e90-a2ed-3a2aa911e809
  text: 'Au mécanisme pression-volume : l''air des cavités se comprime à la descente
    et la dépression agit sur les tissus si l''on ne compense pas.'
- id: 90c724e5-ac8a-4ea9-a653-4627b96245d8
  text: À la toxicité de l'azote, qui s'accumule dans les cavités aériennes au cours
    de la descente.
- id: b903db95-d562-47af-bea6-ce3c6be2e27e
  text: À la température de l'eau, qui contracte les cavités aériennes pendant toute
    la plongée.
- id: b77012f7-4e9c-4196-84c8-3154788c828f
  text: À la pression partielle d'oxygène, qui irrite les muqueuses des cavités dès
    dix mètres.
correct_choice_ids:
- b1dc06ea-e0d5-4e90-a2ed-3a2aa911e809
explanation: 'Comme pour les oreilles, c''est la relation pression-volume : l''air
  emprisonné se comprime, et sans compensation la dépression agit sur les tissus voisins.'
