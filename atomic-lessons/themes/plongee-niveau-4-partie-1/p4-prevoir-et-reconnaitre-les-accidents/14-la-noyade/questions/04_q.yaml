explanation: 'La noyade secondaire est précédée d''une syncope ; l''organisme continue
  à produire du CO2 jusqu''au seuil où le réflexe respiratoire réapparaît (plusieurs
  dizaines de secondes). D''où l''importance de maintenir les voies aériennes hors
  de l''eau : des victimes en simple syncope se sont noyées lors du tractage en surface.'
