prompt: Comment se déroule une noyade secondaire, selon le manuel ?
choices:
- id: 35cdd329-d32d-4631-916f-50380c52928a
  text: Une syncope survient d'abord ; au réflexe respiratoire, si le sujet est encore
    dans l'eau, il se noie.
- id: b62f0713-77c9-455f-ae95-25b3b4a55dcb
  text: La victime inhale d'abord une très grande quantité d'eau, puis perd connaissance
    au fond.
- id: 81572520-4eb1-4429-b128-91299f678d56
  text: La victime est immédiatement en arrêt cardiaque complet, sans aucune phase
    de syncope préalable.
- id: e50e0184-648e-45a3-b152-3e48669ef1df
  text: La victime se noie uniquement dans le cas où elle panique pendant sa remontée
    vers la surface.
