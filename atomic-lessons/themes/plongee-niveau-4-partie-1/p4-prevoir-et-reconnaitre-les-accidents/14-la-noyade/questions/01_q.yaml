explanation: 'L''eau n''est pas notre milieu ; des événements anodins en surface prennent
  une autre dimension dans l''eau. Même en scaphandre, inexpérience, panique, mauvaise
  gestion du matériel ou de la réserve d''air peuvent conduire à la noyade. Le maître
  mot : la prévention.'
