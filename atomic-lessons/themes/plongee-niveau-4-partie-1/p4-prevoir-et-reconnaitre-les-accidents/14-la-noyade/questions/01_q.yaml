prompt: Que rappelle le manuel sur le milieu aquatique et la noyade ?
choices:
- id: 5d25c2d6-8380-4e52-b319-d1b039d9d0ce
  text: 'L''eau n''est pas notre milieu : des événements anodins en surface (essoufflement,
    peur, léger malaise) prennent une tout autre dimension dans l''eau.'
- id: e15101e5-b6c8-4efc-ae3c-f80338a9bdc8
  text: L'eau est un milieu tout à fait naturel pour l'homme, qui s'y adapte en quelques
    minutes.
- id: 81a5d606-608f-4fe8-8042-b5024bdfa018
  text: Seuls les apnéistes et les baigneurs peuvent un jour être victimes d'une noyade.
- id: 4cb9130e-5574-462c-86f3-2af1846ce251
  text: Un plongeur équipé d'une bouteille ne court strictement aucun risque de noyade,
    grâce à sa réserve.
