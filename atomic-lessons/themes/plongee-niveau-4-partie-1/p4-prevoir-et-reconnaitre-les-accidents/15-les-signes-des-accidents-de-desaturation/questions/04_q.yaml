explanation: Un foramen ovale perméable, associé à un comportement inadapté (effort,
  Valsalva à la remontée), peut autoriser le passage de bulles veineuses dans le circuit
  artériel. Les hyperpressions thoraciques sont donc à proscrire en fin de plongée.
