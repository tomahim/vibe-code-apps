prompt: Comment des bulles veineuses peuvent-elles passer dans le circuit artériel
  ?
choices:
- id: 04ed2fa0-dbad-48f2-be5d-65b98a1d7b13
  text: Par un shunt cardiaque (foramen ovale perméable) ou pulmonaire, favorisé par
    un effort ou une manœuvre de Valsalva à la remontée.
- id: 51d8b5aa-96a9-46d1-9749-3d3e667a2783
  text: Uniquement si le plongeur a oublié tous ses paliers de décompression pendant
    la remontée.
- id: 0635939c-0f7d-42b0-b899-edd1aad0e617
  text: Par simple diffusion à travers la peau, en cas de combinaison étanche mal
    réglée.
- id: bcd9cd6e-d66f-4825-828d-2d8a0b7ab6d6
  text: 'Ce passage est physiquement impossible : les bulles veineuses restent toujours
    veineuses.'
