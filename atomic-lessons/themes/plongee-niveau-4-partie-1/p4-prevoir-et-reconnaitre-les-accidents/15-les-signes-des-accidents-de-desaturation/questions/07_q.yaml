prompt: Que conseille le manuel face à la réaction plaquettaire (le « sludge ») ?
choices:
- id: 98b37457-c4b1-4c83-8600-935aaf0b41fc
  text: S'hydrater après chaque plongée ainsi qu'en cas d'accident, l'administration
    d'oxygène restant primordiale et urgente.
- id: 781466d6-db53-4f7e-93dc-bc1907b5f2f4
  text: Prendre systématiquement un anticoagulant la veille de chaque plongée en milieu
    naturel.
- id: bdf2ade5-bc14-400e-9e38-be915d574049
  text: Provoquer une sudation abondante afin d'éliminer l'azote par la peau après
    la plongée.
- id: a8e7aa29-d79a-463f-a5bb-4557c7ea783a
  text: 'Ne rien faire : ce phénomène est toujours sans conséquence sur la circulation
    sanguine.'
