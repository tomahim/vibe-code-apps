explanation: 'Au contact d''une bulle, les plaquettes s''agrègent et la viscosité
  sanguine augmente (« sludge ») : les organes sont moins bien irrigués. Pour limiter
  ce phénomène, il est conseillé de s''hydrater après chaque plongée et en cas d''accident
  ; l''oxygène reste primordial.'
