explanation: 'Phénomène déjà décrit par Haldane en 1908 : présentes dans la circulation
  veineuse à chaque remontée, ces bulles sont tolérées si elles restent très petites
  et peu nombreuses, et sont éliminées par le filtre pulmonaire. Elles deviennent
  dangereuses si elles grossissent ou passent dans la grande circulation.'
