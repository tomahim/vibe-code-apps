explanation: 'Quatre phases selon Michaud : constitution (réversible, sans symptôme
  - c''est le délai, estimé à environ 3 minutes, mis à profit par les tables et ordinateurs),
  organisation (symptômes nets, urgence des secours), troubles généraux dans les cas
  graves, puis séquelles éventuelles si les secours ont été défaillants.'
