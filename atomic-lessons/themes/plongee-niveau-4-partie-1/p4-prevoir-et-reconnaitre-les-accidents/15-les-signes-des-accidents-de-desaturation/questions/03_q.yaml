explanation: 'La formation de bulles fait intervenir la quantité de gaz inerte dissous
  (qui dépend du débit cardiaque : effort, froid, essoufflement, stress l''augmentent)
  et la préexistence de poches de germes gazeux qui favorisent l''apparition et le
  grossissement des bulles.'
