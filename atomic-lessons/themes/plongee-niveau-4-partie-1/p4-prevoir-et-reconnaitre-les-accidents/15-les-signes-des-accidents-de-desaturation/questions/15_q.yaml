prompt: Que dit le manuel du délai d'apparition des symptômes d'un ADD ?
choices:
- id: c82e795b-6826-4f86-b43a-e8b1150fff53
  text: Environ 70 à 85 % des ADD surviennent dans la première heure ; environ 20
    à 25 % se déclarent entre 1 h et 24 h.
- id: 7e57d56c-85a1-4410-bcb3-5facc158a659
  text: La quasi-totalité des ADD survient plus de vingt-quatre heures après la sortie
    de l'eau.
- id: ab834a62-02b7-4606-9013-c6bb2c5c9b19
  text: Tous les ADD se déclarent pendant la plongée, ce qui rend la surveillance
    en surface inutile.
- id: 39c97dbc-75d8-4639-a5f4-a966cf6d2cff
  text: Aucun ADD ne peut se déclarer dans les dix premières minutes suivant la sortie
    de l'eau.
correct_choice_ids:
- c82e795b-6826-4f86-b43a-e8b1150fff53
explanation: 'Phase rapide (0-10 min) : 50 à 55 % des ADD ; phase moyenne (10-60 min)
  : 20 à 30 % ; phase lente (1 h-24 h) : 20 à 25 %. La surveillance ne s''arrête donc
  pas à la sortie de l''eau.'
