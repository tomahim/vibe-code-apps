prompt: Quel est le mécanisme de l'OPI selon le manuel ?
choices:
- id: 27e6da9a-6331-42fe-98a9-c949f299e32e
  text: La redistribution du sang vers le thorax (blood-shift, froid) augmente la
    pression capillaire pulmonaire, et du liquide passe dans les alvéoles si la barrière
    défaille.
- id: c20467e5-7a66-45cf-86aa-6833e9b13870
  text: L'air comprimé dissout les parois des alvéoles, qui se remplissent alors d'eau
    de mer pendant la plongée.
- id: f693da6c-1119-482e-ade5-30ff2dbe93a8
  text: La pression de l'eau comprime le thorax et expulse le sang directement dans
    les bronches.
- id: 09ff8597-4b5b-4d24-a3c0-5c2f5ae2d25a
  text: L'azote forme des bulles dans les capillaires, qui éclatent et remplissent
    les alvéoles.
