prompt: Pourquoi la déshydratation est-elle un facteur de risque en plongée, selon
  le manuel ?
choices:
- id: b359527e-f401-4633-9e86-fb1219853e0e
  text: Elle augmente la viscosité sanguine, ce qui accroît les risques d'accident
    de désaturation et en aggrave les conséquences.
- id: 1e3c7141-3366-4eed-bcf3-f5e911299cd2
  text: Elle provoque des crampes musculaires violentes, qui empêchent toute nage
    de retour.
- id: 5b04a20f-3f90-4945-8a11-6bf62b8bbbe0
  text: Elle diminue directement la quantité d'air disponible dans la bouteille de
    plongée.
- id: 8172c017-ef1c-4621-81f4-ba6d0e1f4603
  text: Elle accélère fortement la narcose, quel que soit le mélange gazeux respiré.
