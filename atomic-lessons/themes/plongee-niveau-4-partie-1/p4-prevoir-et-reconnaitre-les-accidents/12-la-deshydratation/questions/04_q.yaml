prompt: Quels facteurs de plongée augmentent les besoins en eau, selon le manuel ?
choices:
- id: 094c5594-8451-4694-ac86-3b58529cb3c8
  text: La diurèse d'immersion, la respiration de gaz sec, l'absence de prise de liquide,
    la sudation et les pertes gastro-intestinales.
- id: 39dc8f64-ed91-4e9e-964e-4dd3470de31c
  text: Uniquement la température de l'eau, lorsqu'elle dépasse localement les trente
    degrés.
- id: 688cc72c-2813-43cf-bc0b-34119307a51f
  text: Uniquement la consommation excessive de café dans les heures qui précèdent
    la plongée.
- id: b5a0f838-9856-41c7-ab85-bd5a4863aaaf
  text: Le port prolongé du masque et du tuba, qui déshydratent progressivement le
    visage.
