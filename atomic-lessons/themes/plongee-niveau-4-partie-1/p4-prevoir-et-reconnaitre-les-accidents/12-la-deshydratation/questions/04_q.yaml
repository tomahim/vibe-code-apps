explanation: 'Facteurs favorisant l''élimination des liquides : l''immersion elle-même
  (diurèse d''immersion), le gaz sec respiré, l''absence de prise de liquide pendant
  la plongée, la sudation (soleil, effort, attente en combinaison, vent) et les embarras
  gastro-intestinaux des voyages.'
