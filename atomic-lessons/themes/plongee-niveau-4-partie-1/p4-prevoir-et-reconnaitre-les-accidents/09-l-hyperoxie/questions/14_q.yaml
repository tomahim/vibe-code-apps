prompt: Quels sont les deux risques majeurs d'une crise d'hyperoxie en plongée, selon
  le manuel ?
choices:
- id: 0a4ccb17-ce5d-4c96-942e-b373906e9a1f
  text: La noyade pendant les convulsions, et la surpression pulmonaire si la remontée
    a lieu pendant l'apnée.
- id: abe03ed4-08f3-470d-9095-a8ed47f3709e
  text: L'accident de désaturation et la narcose, à toutes les profondeurs de plongée.
- id: 42b82c6d-3d8c-4d7c-b19d-24d3c4d2556b
  text: La barotraumatisme des oreilles et le placage du masque pendant la crise.
- id: f546ca92-0121-4470-8fcc-b250b7e10f8c
  text: L'hypothermie et la déshydratation, du fait de la durée de la crise.
