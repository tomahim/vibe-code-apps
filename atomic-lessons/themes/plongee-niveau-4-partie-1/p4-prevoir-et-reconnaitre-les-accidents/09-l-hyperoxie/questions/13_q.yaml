prompt: Que se passe-t-il pendant la phase d'apnée tonique ?
choices:
- id: 5379ee58-1ad0-4637-9ad7-847129c1f213
  text: Des contractions musculaires généralisées ; les muscles respiratoires se contractent
    et la glotte se ferme, provoquant une apnée.
- id: 8eab3b4a-00cf-4573-93fd-4e6fa4417277
  text: Un retour progressif à la normale, dans un état confus et agité, sans aucun
    souvenir de la crise.
- id: b062a084-4422-4556-85bf-018d7fc13acd
  text: Une simple gêne ventilatoire passagère, accompagnée d'une légère accélération
    du pouls.
- id: cf46f3ae-8f9e-42cc-a95c-aaf022719b5d
  text: Une respiration volontairement rapide et superficielle, qui finit par hyperventiler
    le plongeur.
