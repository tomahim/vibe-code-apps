explanation: 'Fréquence élevée mais de faible amplitude : l''air alvéolaire ne se
  renouvelle plus, le CO2 s''accumule, et la régulation - prévue pour apporter de
  l''O2 - aggrave encore l''inspiration au lieu de l''expiration.'
