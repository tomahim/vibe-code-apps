prompt: Pourquoi le cercle vicieux de l'essoufflement s'installe-t-il ?
choices:
- id: 7523fd64-53c3-401a-918d-72106b57bef0
  text: 'La régulation commande d''inspirer davantage pour accroître l''O2, alors
    qu''il faudrait expirer pour éliminer le CO2 : la ventilation devient superficielle.'
- id: 099ba931-efd1-4209-b4c6-228004072cf9
  text: La glotte se referme automatiquement et complètement dès que le taux de CO2
    augmente dans le sang.
- id: b17c3a8c-f236-491e-87bd-00ea11def320
  text: Le détendeur cesse brutalement de fournir de l'air dès que la fréquence ventilatoire
    du plongeur augmente.
- id: b6be58b3-c1d7-4edc-b853-9926993d38ab
  text: Le diaphragme se paralyse progressivement sous l'effet direct de la pression
    de l'eau sur le thorax.
