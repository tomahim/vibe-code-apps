prompt: Quelle est la première mesure face à un essoufflement ?
choices:
- id: 16e700ec-4882-43dc-9374-67342422f5fd
  text: 'Faire cesser tout effort : chercher des points d''appui si la plongée est
    peu profonde, ou prioriser la remontée aux gilets au-delà de 20 m.'
- id: 46b0905c-1f70-46be-885e-23b6c798f204
  text: Faire palmer le plongeur un peu plus doucement pendant encore quelques minutes.
- id: 4b4f1acf-dd5c-485b-827e-ed44748bcc01
  text: Faire hyperventiler le plongeur pendant quelques minutes pour chasser le CO2
    rapidement.
- id: c74eb6e6-163c-455a-8c4c-447b127a967b
  text: Faire remonter le plongeur seul, le plus vite possible, vers la surface et
    le bateau.
correct_choice_ids:
- 16e700ec-4882-43dc-9374-67342422f5fd
explanation: Cessation de tout effort ; en plongée peu profonde (10-20 m), points
  d'appui plutôt que pleine eau ; au-delà, remontée aux gilets pour soustraire le
  plongeur à la densité du gaz.
