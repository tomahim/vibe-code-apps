  text: 'La masse volumique de l''air augmente : un litre d''air pèse 1,2 g au niveau
    de la mer, contre plus de 6 g à 40 m.'
- id: 640fd760-76a1-40dd-8bf9-4828d5581c05
  text: La pression comprime les poumons, qui ne peuvent plus se remplir qu'à moitié.
- id: d29ac0e9-4331-4557-b627-8e344d65c220
  text: Le froid de l'eau contracte les muscles intercostaux et le diaphragme.
- id: df449383-0b54-4b70-9e2c-0a38f2a7f580
