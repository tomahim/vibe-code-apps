prompt: Dans quel cas la PpCO2 peut-elle augmenter avec la profondeur ?
choices:
- id: c18dd04e-938c-49e6-85ed-7a4add39a55f
  text: En cas d'erreur de gonflage (CO2 dans l'air comprimé) ou de mauvaise épuration
    du CO2 dans un recycleur.
- id: e7a5d896-a7bf-470b-9059-e3c941aa8eb1
  text: Systématiquement, dès que le plongeur dépasse vingt mètres de profondeur.
- id: 3a90be08-f25f-4cd7-8b73-6dcf459da60b
  text: Uniquement lorsque le plongeur retient volontairement sa respiration au fond.
- id: 88de32a3-1187-49e2-ab19-1f489a29c405
  text: Quand la température de l'eau est inférieure à dix degrés Celsius.
correct_choice_ids:
