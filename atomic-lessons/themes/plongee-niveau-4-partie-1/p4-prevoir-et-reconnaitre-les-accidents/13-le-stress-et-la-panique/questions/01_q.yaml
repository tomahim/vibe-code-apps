explanation: En cas de stress ou d'effort, les nerfs cardiaques et des hormones augmentent
  le rythme cardiaque ; la quantité de sang, et donc d'oxygène, transmise aux organes
  (muscles en particulier) augmente. Contrôle assuré par le système nerveux végétatif.
