prompt: Quelle conduite de descente le manuel recommande-t-il au guide ?
choices:
- id: d1a1353b-b9dd-4e66-8d73-caa32ddf1cbf
  text: Une descente relativement lente, une communication régulière, de préférence
    le long d'un mouillage ou d'un tombant plutôt qu'en pleine eau.
- id: 0dd76206-2a78-4670-b6e6-a5b01b78e5b9
  text: Une descente la plus rapide possible, sans communication, afin de profiter
    au maximum du temps de fond.
- id: ca7586d6-3d2a-464d-a4b6-cde5a12a1277
  text: Une descente en pleine eau, de préférence sans aucun repère visuel disponible.
- id: b4529c95-46f3-4c32-98ea-3786137c461a
  text: Une descente en silence total, afin de ne pas stresser davantage la palanquée.
correct_choice_ids:
- d1a1353b-b9dd-4e66-8d73-caa32ddf1cbf
explanation: Adoptez une vitesse de descente relativement lente, communiquez régulièrement
  pendant la descente et préférez un mouillage ou un tombant à la pleine eau ; au
  fond, demandez à chacun si tout va bien et soyez attentif aux réactions.
