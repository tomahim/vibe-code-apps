prompt: Début mai, un plongeur sédentaire veut descendre à 40 m « parce que son brevet le permet ». Quelle attitude pour le guide ?
choices:
- id: f6183404-bf61-43d0-84a9-9d8816659269
  text: Proposer une remontée en puissance progressive, par exemple vers 15-20 m pour la première plongée.
- id: ae214232-88b2-4f19-9dd7-49bbafa9ebf1
  text: 'Accepter : le brevet pré-positionne les aptitudes, rien à redire.'
- id: 91038314-2c5a-4cf7-a898-a9426a6783d8
  text: Refuser de l'emmener à toute profondeur ce week-end.
- id: e1f38499-2253-46dc-b8dc-39d1a5e5cec6
  text: Lui faire signer une décharge avant la descente à 40 m.
