prompt: Un plongeur mentionne au briefing qu'il est sous bêtabloquants. Que fait le guide ?
choices:
- id: 42c20a78-7efe-4728-afdb-dd255631e0bb
  text: Il en informe le directeur de plongée, qui appréciera la situation avec le plongeur.
- id: 0134904b-8a0a-4038-abec-059b6c7475a1
  text: Il autorise la plongée si le plongeur se sent en forme ce jour-là.
- id: 4cf98ffe-5da9-417b-90f8-f7e160c55ae1
  text: Il refuse catégoriquement le plongeur dans sa palanquée.
- id: 92d75cb6-5637-4a1b-9d80-72aa631256c5
  text: Il demande au plongeur de signer une décharge de responsabilité.
correct_choice_ids:
- 42c20a78-7efe-4728-afdb-dd255631e0bb
explanation: 'Les traitements par bêtabloquants font partie des situations cardiologiques à signaler. Le guide ne juge pas : il oriente vers le DP, seul habilité avec le plongeur - et si besoin un médecin - à décider.'
