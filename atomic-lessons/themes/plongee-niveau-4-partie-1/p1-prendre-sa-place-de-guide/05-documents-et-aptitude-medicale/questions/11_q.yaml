prompt: Pourquoi la reprise de la plongée doit-elle être progressive ?
choices:
- id: 8311544d-7d6a-4b21-97c5-f4bbe81b8776
  text: La saturation et la désaturation sollicitent fortement l'organisme ; la sédentarité fait surestimer sa condition.
- id: 712cde90-5988-46b1-bc43-58b6b7f54195
  text: Le matériel se dégrade pendant l'hiver et doit être testé doucement.
- id: 076176e2-1b22-4e88-89eb-fe6b0d91513f
  text: Les fédérations l'imposent pour limiter le nombre de plongeurs à l'eau.
- id: e5d0518c-af30-4140-9636-70866c24624d
  text: L'eau est plus froide en début de saison, c'est le seul risque.
