explanation: 'Le guide n''a ni compétence médicale ni responsabilité juridique pour vérifier les documents : c''est le rôle du DP. En revanche, il signale ce qu''il observe - grossesse évoquée, traitement, problème d''oreille - avant l''immersion.'
