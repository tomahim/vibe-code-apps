  text: 'Non : le baptême fait partie des cas où le certificat n''est pas exigé, sauf cadre particulier comme l''handisub.'
- id: 29b6b4f2-7e21-4f6a-9872-6f83d1769634
  text: 'Oui : tout plongeur, même en baptême, doit présenter un certificat de moins d''un an.'
- id: 70244385-1649-4686-ae09-ce575eb79754
  text: Oui, mais seulement pour les baptêmes de mineurs.
- id: 824ba79d-ca0c-4c67-97f6-86ed2d7c726b
  text: Non, car le baptême n'est pas une activité de plongée réglementée.
