prompt: Un plongeur blessé poursuit son club. Sur quel fondement la responsabilité civile contractuelle peut-elle être engagée ?
choices:
- id: 3ad31373-4b31-4b01-88b2-b7e0618fc210
  text: L'inexécution ou la mauvaise exécution du contrat de prestation de plongée.
- id: 0de3f2c8-1b47-4856-8564-8c2d316f2450
  text: Une faute pénale intentionnelle du dirigeant du club.
- id: c592b595-d6e6-4df3-85f9-c17b601a79e1
  text: L'absence d'assurance individuelle accident du plongeur.
- id: e90e41a3-3e51-4b5c-bdd0-948442ad5db2
  text: La vétusté du matériel appartenant au plongeur lui-même.
correct_choice_ids:
- 3ad31373-4b31-4b01-88b2-b7e0618fc210
explanation: La responsabilité civile contractuelle est engagée quand un dommage résulte de l'inexécution ou de la mauvaise exécution d'un contrat - et toute prestation de plongée est un contrat, même non écrit et en milieu associatif.
