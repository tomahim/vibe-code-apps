prompt: Que reste-t-il de la « théorie de l'acceptation des risques » en plongée de loisir ?
choices:
- id: 00b02a32-b615-48f4-ae5c-a33fe3ecda4e
  text: 'Elle est écartée par la jurisprudence : le plongeur n''accepte pas les risques de son activité.'
- id: 452fb67c-ad6e-42d8-b80b-c9aa96802834
  text: Elle exonère totalement les moniteurs en cas d'accident.
- id: ec22ed5d-fcd0-4ce1-b872-0a97e9364761
  text: Elle s'applique uniquement aux plongeurs très expérimentés.
- id: 3fa2dbc9-b817-4fd8-898b-c94875e21471
  text: Elle permet de se passer d'assurance responsabilité civile.
