prompt: Un guide emmène des niveau 1 à 20 m alors qu'une houle forte fatigue les plongeurs. Quelle analyse ?
choices:
- id: 1217bed9-7d41-49cd-808f-8eb65a0c115e
  text: 'Même dans ses prérogatives, il devait adapter : l''obligation de moyens pouvait imposer de limiter la profondeur.'
- id: b87a82c0-0b78-45bc-b310-2c63a58bade4
  text: 'Il est couvert : 20 m avec des niveau 1 est dans les prérogatives du guide.'
- id: bff5bcf2-092c-4f69-946b-ce06c5b7f57b
  text: Seul le DP est responsable, puisqu'il a fixé le cadre de la plongée.
- id: b6579c34-659e-4dfb-b45c-703295ce780c
  text: Les plongeurs sont responsables, ayant accepté les risques de la sortie.
correct_choice_ids:
- 1217bed9-7d41-49cd-808f-8eb65a0c115e
explanation: 'Les prérogatives fixent un maximum, pas une obligation : conditions difficiles ou plongeurs fatigués imposent de réduire profondeur ou effectif. L''acceptation des risques est écartée, et le guide reste responsable du déroulement.'
