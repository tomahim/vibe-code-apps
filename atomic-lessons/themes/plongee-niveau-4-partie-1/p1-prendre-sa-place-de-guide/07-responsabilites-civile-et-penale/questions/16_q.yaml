prompt: Pourquoi la responsabilité pénale ne peut-elle pas être assurée ?
choices:
- id: d79de58a-dc52-4de2-90ac-ae64858ed2d5
  text: Parce qu'elle est une sanction personnelle - amende, emprisonnement - et non la réparation d'un dommage.
- id: 20e5cc24-440e-4b18-a02b-4a9b91ba5db1
  text: Parce que les assureurs refusent systématiquement les sports à risque.
- id: 183f9fd3-8eec-4527-a43c-3b573ce2da8b
  text: Parce qu'elle ne concerne que les infractions commises volontairement.
- id: 40977359-581b-4bba-a67b-32a9cff4d773
  text: Parce qu'elle est prise en charge par l'État en cas d'accident.
