explanation: La mise en danger délibérée d'autrui résulte de la violation délibérée d'une obligation de sécurité ou de prudence dès lors qu'elle expose directement autrui à un risque immédiat de mort, de mutilation ou d'infirmité permanente. L'infraction est constituée sans que le risque se réalise.
