explanation: 'Le gilet fait partie du socle obligatoire de tout plongeur. Un matériel douteux en surface devient dangereux en immersion : on répare ou on remplace avant le départ. Exclure le plongeur est une décision à voir avec le DP, pas en improvisation.'
