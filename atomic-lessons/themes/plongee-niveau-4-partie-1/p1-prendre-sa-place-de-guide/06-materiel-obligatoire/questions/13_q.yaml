prompt: Avant l'immersion, un plongeur s'aperçoit que son gilet ne se gonfle pas. Que fait le guide ?
choices:
- id: 9c5220a3-ae2c-4e0b-a94d-6e5c64d6e4ca
  text: 'Il retarde le départ de la palanquée le temps de réparer ou remplacer : on ne part pas avec un matériel douteux.'
- id: 5cbe939a-9dfd-4342-9802-e99408e3515e
  text: Il propose au plongeur de plonger sans gilet, la profondeur étant faible.
- id: 023ccb34-ab65-43f3-9845-fdd69a5c87c2
  text: Il lui prête son propre gilet et plonge sans pour cette fois.
- id: 4ad2d4eb-d617-4581-8716-0a368f99a87e
  text: Il demande au plongeur de rester à bord et part avec les autres.
