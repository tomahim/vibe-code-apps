prompt: Un niveau 4 guide quatre niveau 1. Le DP a fixé 20 m, 40 minutes. À 15 m, un plongeur montre des signes de fatigue. Que doit faire le guide ?
choices:
- id: 6e5733d1-5008-4135-bd14-357fe49a56b5
  text: Remonter la palanquée à une profondeur plus faible ou écourter la plongée.
- id: 19548ed0-04c0-4259-bfcf-e3b22637bebd
  text: Poursuivre jusqu'à 20 m pour respecter le programme du DP.
- id: 3f1aa833-f276-4a2c-9cb5-6a0ae5530ede
  text: Faire remonter le plongeur fatigué seul et continuer avec les trois autres.
- id: ad56754b-ea55-4879-9db7-e2a11072d20a
  text: Interrompre la plongée pour toutes les palanquées du bateau.
