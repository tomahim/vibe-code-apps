explanation: 'Le guide est responsable du déroulement de sa plongée : il adapte profondeur, durée ou trajet aux circonstances, sans jamais dépasser le cadre du DP. Faire remonter un plongeur seul est une faute ; décider pour les autres palanquées relève du DP.'
