explanation: Lorsqu'un mélange autre que l'air est utilisé, l'encadrant de la palanquée doit justifier des aptitudes correspondant à ce mélange, même si c'est un autre membre de la palanquée qui le respire. Sans aptitude nitrox, un niveau 4 n'a pas de prérogative nitrox.
