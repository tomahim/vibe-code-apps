prompt: Qu'est-ce qu'une aptitude au sens du code du sport ?
choices:
- id: 02a7a7e8-9c48-4a84-ba48-dcc02d4564ec
  text: Une compétence reconnue, que le directeur de plongée peut apprécier au moment de la plongée.
- id: 73d9a5a8-049e-4449-9beb-1218ccadc685
  text: Un brevet délivré par une fédération après une formation validée.
- id: 47b58afb-af60-45ab-b436-ba631991137b
  text: Un droit définitif acquis à vie par la réussite d'un examen.
- id: cf3a8041-0fa0-42ed-ba53-f00764bdea63
  text: Une mention du carnet de plongée signée par un moniteur.
