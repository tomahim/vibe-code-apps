prompt: Pourquoi le carnet de plongée est-il si important pour le directeur de plongée ?
choices:
- id: 6fe73b67-f795-45d0-b038-f858fc52ec65
  text: 'Il documente l''expérience acquise : fréquence, conditions et types de plongées réalisées.'
- id: 2993a74e-2c05-4c01-a49d-cbe00a6be4f6
  text: Il remplace le brevet pour prouver le niveau du plongeur.
- id: bb9da382-0b5c-4aef-af77-f5ae1b23cfee
  text: Il atteste que le plongeur est à jour de sa licence fédérale.
- id: 5bf303db-5517-453f-af37-2dac83e33b82
  text: Il certifie l'absence de contre-indication médicale à la plongée.
correct_choice_ids:
- 6fe73b67-f795-45d0-b038-f858fc52ec65
explanation: 'Le carnet renseigne l''expérience réelle : date de la dernière plongée, nombre de plongées, conditions rencontrées. Avec le brevet et l''observation du comportement, il fonde la reconnaissance des aptitudes par le DP.'
