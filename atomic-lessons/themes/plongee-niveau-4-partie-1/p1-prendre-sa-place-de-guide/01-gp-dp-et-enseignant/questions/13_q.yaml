prompt: Le DP a fixé 25 m et 40 minutes. En cours de plongée, un plongeur consomme vite et l'eau se trouble. Que doit faire le guide ?
choices:
- id: fa683486-5c52-41b1-afd1-07f5c81dd630
  text: 'Réduire la profondeur ou raccourcir la plongée : adapter le cadre vers plus de sécurité fait partie de sa responsabilité.'
- id: b93d9557-6e46-4077-ae78-c5be45b9c75e
  text: 'Poursuivre le programme prévu : les consignes du directeur de plongée doivent être respectées à la lettre.'
- id: 92162fcf-507a-49b6-824e-76e91fd92ff8
  text: Ramener la palanquée au bateau et reprocher au DP des consignes inadaptées.
- id: 68742d39-1089-4115-b425-1ff182c56f09
  text: Demander au plongeur lent de remonter seul en surface pour finir le parcours.
correct_choice_ids:
- fa683486-5c52-41b1-afd1-07f5c81dd630
explanation: 'Les consignes du DP ne peuvent pas être dépassées, mais rien n''oblige à les exploiter au maximum. Le GP est responsable du déroulement : il doit adapter profondeur, durée ou trajet aux circonstances et aux aptitudes des plongeurs.'
