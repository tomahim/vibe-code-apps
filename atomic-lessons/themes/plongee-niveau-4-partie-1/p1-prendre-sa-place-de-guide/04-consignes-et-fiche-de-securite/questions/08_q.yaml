prompt: Si une information manque dans le briefing du DP, que fait le guide ?
choices:
- id: ef5f2954-0d6b-4051-bb29-c66f07cdf0d5
  text: 'Il la demande avant l''immersion : en plongée, il sera trop tard pour négocier.'
- id: 909228f3-f1a3-482d-b354-d911f10c9210
  text: Il décide lui-même du paramètre manquant et l'annonce à sa palanquée.
- id: 5771fc34-ff76-430f-886d-ba5b56d4d520
  text: Il applique les limites réglementaires maximales par défaut.
- id: 57afa6cc-a004-4975-ac15-8e3263e44e0e
  text: Il annule la plongée de sa palanquée sans en référer au DP.
