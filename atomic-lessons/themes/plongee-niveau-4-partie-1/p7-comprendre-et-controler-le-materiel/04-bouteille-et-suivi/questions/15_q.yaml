explanation: Évitez les chocs, le soleil et les gonflages trop rapides (condensation,
  corrosion) ; toute suspicion d'entrée d'eau impose une inspection par un spécialiste
  ; entreposez debout, robinet fermé ; maintenez la peinture, ajoutez un filet, rincez
  régulièrement. Et ne changez jamais vous-même la robinetterie.
