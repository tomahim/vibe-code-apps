prompt: Pourquoi des huiles spécifiques sont-elles utilisées dans un compresseur de
  plongée ?
choices:
- id: 6d9cdbcf-ce82-4600-a0a8-95d4449ada3f
  text: 'Hautes températures et air respirable : il faut une faible présence dans
    l''air produit et un pouvoir lubrifiant à haute température.'
- id: 341e7948-e625-4b04-9f63-790b0d9c8a68
  text: Ce sont les huiles les moins chères du marché, pour limiter les coûts du club.
- id: 3b437945-7638-444e-bab1-f15136a5a5c0
  text: Elles parfument l'air respiré par les plongeurs sous l'eau.
- id: e466c2b2-e144-4c83-952d-1bad87d19f63
  text: Elles colorent l'air pour détecter les fuites sur la rampe.
