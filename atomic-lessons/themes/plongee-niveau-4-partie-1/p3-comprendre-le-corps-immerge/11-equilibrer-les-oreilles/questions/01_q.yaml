prompt: Quelle différence entre méthodes actives et passives ?
choices:
- id: f3dcf5a9-89dc-42a4-bb7f-334e6f693437
  text: Les actives forcent l'ouverture de la trompe par hyperpression ; les passives
    la maintiennent ouverte sans hyperpression.
- id: 0fc96706-6da3-4985-b915-a9a4cef6515a
  text: Les actives se font uniquement à la remontée ; les passives, uniquement à
    la descente.
- id: e0df54a2-f5e8-4fe0-ae88-9dc01688bea5
  text: Les actives sont sans risque ; les passives sont dangereuses.
- id: 868853f2-3333-4cab-966d-0dec0fd42153
  text: Les actives sont interdites ; les passives sont obligatoires.
