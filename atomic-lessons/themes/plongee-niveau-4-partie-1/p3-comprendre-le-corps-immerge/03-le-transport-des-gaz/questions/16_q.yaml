- id: 697ccdda-72b0-4a40-bd96-54532336cddb
  text: Uniquement pour soigner le mal de mer, la fatigue accumulée et le stress de
    bord.
- id: 2036d322-87aa-49ff-982a-c3c44c915d81
  text: Uniquement en cas de noyade en piscine, jamais en mer.
- id: e79a0cc6-39dd-4035-843f-2f2b1b5f3f74
  text: Pour toutes les plongées dépassant 20 mètres, en prévention.
