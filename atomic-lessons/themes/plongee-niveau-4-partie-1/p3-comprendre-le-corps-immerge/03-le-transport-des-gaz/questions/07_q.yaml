prompt: Que se passe-t-il quand l'hémoglobine est saturée en oxygène ?
choices:
- id: 175573b7-96b3-4738-9173-99333482760a
  text: Tout oxygène supplémentaire est transporté sous forme dissoute, comme en plongée
    ou lors de l'administration d'O2 pur.
- id: 8faa27d6-2dc9-4b04-8b45-533bb2ebf3b4
  text: L'excédent d'oxygène est rejeté immédiatement par les reins et évacué par
    la peau.
- id: 314735b9-d754-41fc-b2d7-0e8106c6f2e0
  text: La respiration s'arrête jusqu'au retour à l'équilibre.
- id: 1b75fdde-69a3-4311-92e5-79e9defa050e
  text: L'oxygène se transforme en azote dans les capillaires.
