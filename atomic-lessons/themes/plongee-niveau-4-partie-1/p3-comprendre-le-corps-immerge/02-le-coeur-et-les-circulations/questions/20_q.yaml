  text: L'ensemble des échanges alvéolo-capillaires permettant l'apport d'oxygène
    au sang et l'élimination du gaz carbonique.
- id: 591d3ffc-ca8d-4032-b2b7-b768799fd1c8
  text: La coagulation accélérée du sang au contact de l'eau froide pendant l'immersion.
- id: ad3b626b-b27c-4b55-8c1d-3dc631a65f4a
  text: Le passage direct du sang veineux dans l'aorte sans passer par les poumons.
- id: a43bc41c-4210-44de-8a53-78f5637b7952
