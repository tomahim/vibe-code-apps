prompt: Pourquoi a-t-on envie d'uriner quand on a froid ?
choices:
- id: df0d668b-0fae-44c3-849c-111f7f588e63
  text: L'afflux sanguin vers le cœur déclenche une régulation qui diminue le surplus
    de liquides ; cette diurèse due au froid s'ajoute à la diurèse d'immersion.
- id: f17b28d1-385e-4d56-bf7b-709924f04d4e
  text: Le froid contracte les muscles du bas-ventre et la vessie ne se contrôle plus
    sous l'eau.
- id: 24a9e950-ba5b-4c22-a7dd-e0f1dc4611c1
  text: L'eau qui circule dans la combinaison exerce une pression directe sur la vessie
    du plongeur.
- id: 1645d15b-e2ca-4807-8712-f67766c57ae5
  text: C'est un réflexe purement psychologique lié au stress de la plongée, sans
    mécanisme physiologique.
