prompt: Quelle différence le manuel fait-il entre paralysie et paresthésie ?
choices:
- id: 1c54b7a8-ac18-46f8-8f8e-14c23064b083
  text: La paralysie est un arrêt de l'activité de muscles ou fonctions ; la paresthésie,
    un trouble de la sensibilité.
- id: 50aefad5-4ce5-4890-9d5b-5b9d30202bea
  text: La paralysie est toujours définitive ; la paresthésie, toujours mortelle.
- id: b05cc617-6f37-45aa-858a-5b89a83d1a57
  text: La paralysie touche les sens ; la paresthésie touche les muscles.
- id: 4bed362b-2781-441b-8baa-cbab9c07db2a
  text: Ce sont deux noms identiques du même symptôme bénin.
correct_choice_ids:
- 1c54b7a8-ac18-46f8-8f8e-14c23064b083
explanation: 'Paralysie : arrêt momentané ou définitif de l''activité de certains
  muscles ou fonctions automatiques comme la ventilation. Paresthésie : trouble de
  la sensibilité (fourmillements, picotements...).'
