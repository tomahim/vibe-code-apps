- id: 89a3fa11-2abf-4720-8fcf-791f2e9256a6
  text: Par le tympan puis les osselets, exactement de la même manière que dans l'air.
- id: 708338aa-60cb-40f5-9f2c-5b4853e9ccec
  text: Par la trompe d'Eustache et le pharynx.
- id: f36f06d1-576d-4209-8c08-e899517dc0ba
  text: Par la voie dentaire, via l'embout du détendeur.
