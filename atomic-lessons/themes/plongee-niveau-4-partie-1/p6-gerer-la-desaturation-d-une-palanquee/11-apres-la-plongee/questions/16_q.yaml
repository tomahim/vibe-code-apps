prompt: Des vacanciers veulent plonger 3 à 4 fois par jour avec ordinateurs. Que dit
  le manuel ?
choices:
- id: 6a04106a-6680-4e3a-a1d5-656dc85fd400
  text: 'Le calcul reste affiché mais sa fiabilité n''est pas établie : respecter
    la règle des 2 plongées par jour.'
- id: 6020019f-3961-41d1-afa8-903601445e32
  text: 'C''est sans risque : les ordinateurs modernes gèrent parfaitement quatre
    plongées quotidiennes.'
- id: 58c1f46e-d07c-4477-95c5-a0c58689991a
  text: C'est possible uniquement avec deux ordinateurs alternés entre les plongées.
- id: 0ad99ea2-10a2-42d5-a18d-321cbb52f72a
  text: C'est possible si chaque plongée reste sous dix-huit mètres de profondeur.
