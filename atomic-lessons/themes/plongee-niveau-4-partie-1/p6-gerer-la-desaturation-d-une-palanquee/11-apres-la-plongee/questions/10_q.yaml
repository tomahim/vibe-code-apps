prompt: Quel délai standard avant de monter en altitude après une plongée ?
choices:
- id: a9fef416-44d8-4d68-ae03-205b98e49155
  text: 12 heures, avec une vigilance accrue quand la montée est rapide (téléphériques).
- id: de84b2e4-a31d-4c6e-a4d7-e9257180b080
  text: 2 heures, le temps que l'azote résiduel soit complètement évacué.
- id: 9c506abd-14a4-4029-b45d-4f5ae0c9982b
  text: 48 heures, quelle que soit l'altitude visée et le moyen de montée.
- id: 09e92f83-8247-48e6-85d5-1bcc39bd71f0
  text: 'Aucun délai : seul l''avion pose un problème, pas la montagne.'
correct_choice_ids:
- a9fef416-44d8-4d68-ae03-205b98e49155
explanation: Ne pas monter en altitude dans les 12 heures qui suivent une plongée
  (par exemple pour skier), d'autant plus vigilant que la phase de montée est rapide
  (téléphériques). L'aide-mémoire retient 6 à 12 h pour l'altitude.
