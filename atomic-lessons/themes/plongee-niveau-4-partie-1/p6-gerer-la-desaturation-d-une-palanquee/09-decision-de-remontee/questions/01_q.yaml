explanation: La décision de remonter consiste à respecter, pour tout le groupe, le
  protocole de désaturation décidé avant la plongée (plongée sans palier, limitation
  à 3 minutes de paliers, etc.) - pas à suivre l'ordinateur le plus optimiste.
