accepted_answers:
- NDL
- No Decompression Limit
explanation: NDL (No Decompression Limit). Il apparaît aussi sous les formes NO DEC,
  NO DECO, NO DEC TIME, NDC ou NO STOP, suivi du temps restant sans palier à la profondeur
  courante.
