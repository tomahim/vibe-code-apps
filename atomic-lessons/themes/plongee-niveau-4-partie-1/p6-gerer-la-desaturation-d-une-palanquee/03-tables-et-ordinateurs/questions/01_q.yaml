prompt: Pourquoi les tables MN90-FFESSM ont-elles été adoptées pour les examens théoriques
  de la FFESSM ?
choices:
- id: 9c1f9a34-14d8-480e-a490-b056308c804e
  text: Pour permettre une harmonisation des résultats entre candidats.
- id: f95e2cbb-bb71-4860-97ed-77d07f14abdf
  text: Parce qu'elles sont les seules tables autorisées en plongée loisir.
- id: d6b5cc92-5a22-4ca4-99e8-40ae9cc5c6b1
  text: Parce que les ordinateurs sont interdits dans l'enseignement fédéral.
- id: 207098a4-f47f-45de-a5cb-9a2c37400a32
  text: 'Pour simplifier la correction : elles ne comportent qu''une seule page.'
