accepted_answers:
- RBT
- Remaining Bottom Time
explanation: 'RBT (Remaining Bottom Time). Il existe aussi AIR TIME ou TTR (Time To
  Reserve) : l''autonomie est estimée en permanence en tenant compte de la consommation,
  de la désaturation et d''une réserve de sécurité.'
