prompt: Pourquoi deux ordinateurs peuvent-ils afficher des profondeurs différentes
  à 40-50 m ?
choices:
- id: 5a7afc77-5d9c-49f6-876a-5105e35d3a9b
  text: 'Étalonnage de densité et tolérance des capteurs : l''affichage peut varier
    de 1 à 2 m.'
- id: 5544794b-cb0f-4f50-9a70-af785dbd8316
  text: Parce que l'un des deux est forcément en panne et doit être révisé.
- id: f5b63960-e485-4182-83ba-d3a16c2bf81a
  text: Parce que la pression varie d'un côté à l'autre du plongeur à ces profondeurs.
- id: e2a6a1dd-9885-4a74-9ec1-0994b3e45261
  text: Parce que les ordinateurs mesurent la profondeur et non la pression.
