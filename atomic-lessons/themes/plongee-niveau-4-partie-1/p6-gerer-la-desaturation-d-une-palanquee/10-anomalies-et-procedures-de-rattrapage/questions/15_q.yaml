explanation: Par convention, le délai de 3 minutes court depuis l'erreur de procédure
  (remontée rapide, interruption de palier) jusqu'à la mise en œuvre du protocole
  de secours (arrivée à la demi-profondeur ou au palier) ; dans la réalité, il faut
  agir le plus vite possible.
