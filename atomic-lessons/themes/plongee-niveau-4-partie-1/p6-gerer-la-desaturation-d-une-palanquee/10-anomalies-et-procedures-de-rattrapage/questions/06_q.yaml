explanation: Le maintien d'une vitesse rapide sans correction dans les 5 à 10 secondes
  conduit la plupart des modèles à créer ou augmenter des paliers obligatoires et
  à pénaliser les plongées suivantes ; aucune procédure de secours n'existe dans les
  modèles.
