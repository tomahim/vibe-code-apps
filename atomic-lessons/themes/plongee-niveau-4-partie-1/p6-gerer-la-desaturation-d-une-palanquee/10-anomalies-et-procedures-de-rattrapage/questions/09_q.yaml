explanation: Il faut redescendre le plus rapidement possible au moins à la profondeur
  du palier interrompu et poursuivre la désaturation en suivant les instructions de
  l'ordinateur ; selon les modèles, un délai max de 2 ou 3 minutes est laissé avant
  le mode « Erreur » ou « Paliers omis » permanent.
