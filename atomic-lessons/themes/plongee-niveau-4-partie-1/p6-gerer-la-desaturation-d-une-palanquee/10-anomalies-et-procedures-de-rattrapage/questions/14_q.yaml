explanation: 'La plongée consécutive (intervalle strictement inférieur à 15 minutes)
  est considérée comme la poursuite de l''immersion précédente : les deux temps d''immersion
  s''additionnent et la profondeur considérée est la plus profonde atteinte au cours
  des deux immersions.'
