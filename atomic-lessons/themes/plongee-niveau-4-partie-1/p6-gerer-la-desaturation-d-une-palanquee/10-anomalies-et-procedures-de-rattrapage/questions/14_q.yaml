prompt: Comment une plongée consécutive est-elle traitée aux tables ?
choices:
- id: 3d18b9fe-8c2f-42ba-af70-729f9ee940d2
  text: Les temps s'additionnent et la profondeur retenue est la plus profonde des
    deux immersions.
- id: 4b954964-bed1-4591-b931-22a18d559d58
  text: Chaque immersion est calculée séparément, comme deux plongées simples.
- id: bb6d5151-32dc-4917-a9b1-27a67d3f3b97
  text: La seconde immersion est ignorée si elle dure moins de quinze minutes.
- id: 15eb3123-3132-45cf-a749-22fd161b9f35
  text: La seconde immersion est traitée comme une plongée successive classique.
