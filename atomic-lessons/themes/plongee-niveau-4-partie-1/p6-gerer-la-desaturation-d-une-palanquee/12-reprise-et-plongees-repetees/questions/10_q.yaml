prompt: Qu'implique une contre-indication relative (CIR) ?
choices:
- id: 3e463a95-31f3-4940-ae65-b54b01c1e5f5
  text: 'Une reprise adaptée : cause évitable, profondeur réduite ou protocoles plus
    sûrs comme les paliers à l''oxygène.'
- id: f536de5b-626a-4190-99c3-d6ca82769a35
  text: Une interdiction totale et définitive de toute pratique de la plongée.
- id: 0d20782b-2cdb-42e5-9be3-54e7dd289fec
  text: Une simple attente de 48 heures avant de replonger normalement.
- id: fbc76155-0b5d-4abd-a720-2b35a4936b84
  text: Une plongée uniquement en piscine pendant toute la saison suivante.
