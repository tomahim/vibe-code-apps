explanation: 'La CIR s''applique en cas de légères séquelles, lorsque la cause de
  l''accident peut être évitée : elle peut conduire à réduire la profondeur ou à adopter
  des protocoles de désaturation plus sûrs, tels que des paliers à l''oxygène par
  exemple.'
