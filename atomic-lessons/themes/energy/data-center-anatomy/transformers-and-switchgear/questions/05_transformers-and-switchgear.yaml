  text: Power factor always equals zero in transformers
- id: 6f79a0e5-3a3c-4ca1-ab20-3b86f063c197
  text: Apparent power measures the stored battery energy
- id: d1af1541-c737-4368-9bd5-9bd1a020332d
  text: Real power ignores every useful electrical load
- id: 88cffd5d-96f9-4274-90c3-3ce70a2ea846
