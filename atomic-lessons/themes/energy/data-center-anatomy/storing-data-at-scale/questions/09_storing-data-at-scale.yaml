  text: Remote storage always has lower access latency
- id: 0dd8168a-99b6-4ec1-b339-c78c0a033ba9
  text: Local storage cannot retain data after shutdown
- id: d5db19c3-2db8-4e23-bc5f-1e0b2d2dc5d9
  text: Shared data can live on networked storage
- id: 603b6114-5fa9-41a1-97e9-0a32a58ff5f1
