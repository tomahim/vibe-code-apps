<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'"><title>Layered Review</title>
<style>
*{box-sizing:border-box}body{--ink:#d4d4d4;--muted:#9a9a9a;--line:#343434;--accent:#a5c9b6;--wash:#24352e;background:#181818!important;color:var(--ink)!important;max-width:none!important;padding:0!important;font:14px/1.55 system-ui,sans-serif;display:block!important;color-scheme:dark}body button,body summary{cursor:pointer}body button,body input{font:inherit}body button{min-height:44px;padding:7px 11px;color:var(--ink);background:#202020;border:1px solid var(--line);border-radius:5px;text-align:left}body button:hover{background:#2c2c2c}body button:focus-visible,body summary:focus-visible,body a:focus-visible,.row:focus-visible{outline:2px solid #a5c9b6;outline-offset:2px}body a{color:#9cdcfe}body>header{margin:0!important;padding:16px 22px!important;background:#181818}body>header h1{font:600 22px/1.3 system-ui,sans-serif!important;color:var(--ink)!important;margin:0!important}body>header p{font-size:13px;color:var(--muted)!important;margin:5px 0 0!important}.workspace{display:grid;grid-template-columns:206px minmax(0,1fr);width:100%;min-width:0;border-top:1px solid var(--line)}.workspace>aside{background:#1c1c1c;border-right:1px solid var(--line);padding:12px}.label{font-size:11px;color:var(--muted);margin:8px 0;text-transform:uppercase;letter-spacing:.08em}.layers{display:grid;gap:5px}.layers button{width:100%;font-size:12px;line-height:1.4}.layers button.active{background:#293a32;border-color:#698c79;color:#d5e9dc}.layers small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.tree button{display:block;width:100%;font:11px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;margin:4px 0}.workspace main{min-width:0;padding:16px 20px}.workspace h2{font:600 19px/1.35 system-ui,sans-serif;margin:0 0 12px;color:var(--ink)}.workspace p{margin:8px 0}.workspace h3{font:600 13px/1.5 system-ui,sans-serif;margin:14px 0 7px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}.toolbar .actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar label{display:flex;gap:7px;align-items:center;min-height:44px;font-size:12px}.status,.legend,.muted{font-size:12px;color:var(--muted)}.layer-description{border-left:2px solid #80a58f;padding:2px 0 2px 12px;margin:10px 0 12px}.attention{font-size:12px;background:#242321;border:1px solid #38352e;padding:9px 12px;margin:10px 0 15px;border-radius:4px}.attention strong{font-weight:600}.attention ul{margin:4px 0 0;padding-left:18px}.diff{margin:12px 0 18px;border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:0;max-width:100%}.filehead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:9px 11px;background:#242424;font:11px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;border-bottom:1px solid var(--line)}.filehead span:first-child{min-width:0}.filehead span:last-child{color:var(--muted)}.diffbody{display:grid;grid-template-columns:minmax(0,1fr) 190px;min-width:0}.diffbody.no-notes{display:block}.codewrap{overflow:auto;max-height:440px;min-width:0;background:#1e1e1e;scrollbar-color:#505050 #1e1e1e;scrollbar-width:thin}.row{display:grid;grid-template-columns:32px 32px 18px auto;width:max-content;min-width:100%;font:11px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;min-height:21px;cursor:pointer}.num{color:#858585;text-align:right;padding-right:7px;user-select:none}.sig{text-align:center;color:#9a9a9a}.code{padding:0 10px;color:#d4d4d4}.hunk{background:#252b34;color:#9bb8d3;cursor:default}.add{background:#203127}.del{background:#3b2527}.focus{background:#314b3b!important;box-shadow:inset 3px 0 #86b59a}.dim .row:not(.focus):not(.hunk){opacity:.4}.row.selected{outline:1px solid #d7ba7d;outline-offset:-1px}.comments{border-left:1px solid var(--line);padding:10px;background:#202020;min-width:0}.comments>span{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.comments button{display:block;border:0;background:none!important;border-left:2px solid #6d927b;border-radius:0;padding:4px 9px;margin:10px 0 16px;font-size:12px;line-height:1.45;min-height:44px;width:100%}.comments b{display:block;color:#a5c9b6;font:10px/1.6 ui-monospace,monospace;margin-bottom:3px}.workspace details>summary{min-height:44px;padding:10px 0;font-size:12px}.description-body{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.75 system-ui,sans-serif;color:var(--ink)}.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font:11px/1.6 ui-monospace,monospace;color:var(--muted);margin:10px 0}.facts span{overflow-wrap:anywhere;max-width:100%}.note{padding:12px;color:#d7ba7d;font-size:12px}.workspace footer{border-top:1px solid var(--line);padding-top:12px;margin-top:20px;font-size:11px;color:var(--muted)}body>footer{padding:12px 22px;color:var(--muted)!important;border-top:1px solid var(--line)}.prototype-image{padding:12px 22px}.prototype-image summary{min-height:44px}.prototype-image img{max-width:100%;width:390px}.summary{font-size:13px}.no-description{margin-top:12px}@media(max-width:1000px){.diffbody{grid-template-columns:minmax(0,1fr) 165px}}@media(max-width:760px){.workspace{display:block}.workspace>aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}.layers{grid-template-columns:1fr 1fr}.layers button{min-width:0;font-size:11px}.layers small{display:none}.workspace main{padding:14px}body>header{padding:14px!important}body>header h1{font-size:20px!important}body>header p{font-size:12px}.diffbody{display:block}.comments{border-left:0;border-top:1px solid var(--line);padding:8px 10px}.comments button{margin:7px 0;font-size:12px}.codewrap{max-height:340px}.workspace h2{font-size:18px}.filehead{flex-direction:column;font-size:10px}.workspace>aside details{margin:6px 0 0}.prototype-image{padding:12px 14px}}

.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 20px;border-bottom:1px solid var(--line);font-size:12px}body{margin:0}body .workspace{max-width:1600px;margin:auto}</style></head><body>
<header class="top"><b>PR review</b><span>Template v0.2 · dark by default · proposed UI</span></header>
<div class="workspace"><aside><div class="label">Review</div><nav class="layers" aria-label="Review tabs" id="layers"></nav><details><summary id="filecount"></summary><div class="tree" id="tree"></div></details></aside><main><div class="toolbar"><span class="status" id="progress"></span><div class="actions"><button id="all">All files</button><button id="reset">Reset</button></div></div><section id="view"></section><footer id="footer"></footer></main></div>
<script id="pr-data" type="application/json">__PR_DATA_JSON__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('pr-data').textContent);let index=0,tab='layer',focus=false;const read=new Set(),selected=new Set();
const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
$('footer').textContent=D.provenance+' No app tests rerun. No comments or approvals sent. Reading marks last for this visit. Code panels preserve full context.';$('filecount').textContent='Changed files ('+D.files.length+')';
function attention(items){const box=el('div',undefined,'attention');box.append(el('strong','Points of attention'));const ul=el('ul');items.forEach(t=>ul.append(el('li',t)));box.append(ul);return box}
function nav(){$('layers').replaceChildren();const desc=el('button','PR description',tab==='description'?'active':'');desc.setAttribute('aria-pressed',tab==='description');desc.onclick=()=>{tab='description';render()};$('layers').append(desc);D.layers.forEach((l,i)=>{const b=el('button',(read.has(i)?'✓ ':'')+String(i+1).padStart(2,'0')+' '+l.title,tab==='layer'&&i===index?'active':'');b.setAttribute('aria-pressed',tab==='layer'&&i===index);b.onclick=()=>{index=i;tab='layer';render()};$('layers').append(b)});$('progress').textContent=read.size+' / '+D.layers.length+' layers read'}
function fileBlock(f,highlights=[]){const box=el('div',undefined,'diff');box.id='file-'+D.files.indexOf(f);const head=el('div',undefined,'filehead');head.append(el('span',f.path),el('span',f.status+' · +'+f.additions+' -'+f.deletions));box.append(head);if(!f.patch){box.append(el('p',f.reason||'No textual patch available. Inspect original file.','note'));return box}const body=el('div',undefined,'diffbody'+(!highlights.length?' no-notes':'')),wrap=el('div',undefined,'codewrap'+(focus?' dim':''));let old=0,newn=0;for(const raw of f.patch.split('\n')){const h=/^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(raw);if(h){old=+h[1];newn=+h[2];wrap.append(el('div',raw,'row hunk'));continue}if(raw.startsWith('\\')){wrap.append(el('div',raw,'row hunk'));continue}const kind=raw[0],before=kind==='+'?'':old++,after=kind==='-'?'':newn++;const key=f.path+':'+before+':'+after,ids=highlights.map((r,i)=>(r.side==='old'?before!==''&&before>=r.start&&before<=r.end:after!==''&&after>=r.start&&after<=r.end)?i:-1).filter(i=>i>=0);const row=el('div',undefined,'row '+(kind==='+'?'add':kind==='-'?'del':'')+(ids.length?' focus':'')+(selected.has(key)?' selected':''));row.dataset.highlights=ids.join(' ');row.append(el('span',String(before),'num'),el('span',String(after),'num'),el('span',kind==='+'||kind==='-'?kind:'','sig'),el('span',raw.slice(1),'code'));row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label','Select old '+(before||'none')+' new '+(after||'none'));row.setAttribute('aria-pressed',String(selected.has(key)));const toggle=()=>{selected.has(key)?selected.delete(key):selected.add(key);row.classList.toggle('selected');row.setAttribute('aria-pressed',String(selected.has(key)))};row.onclick=toggle;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};wrap.append(row)}body.append(wrap);if(highlights.length){const notes=el('div',undefined,'comments');notes.append(el('span','Highlight notes'));highlights.forEach((r,i)=>{const b=el('button');b.append(el('b',r.side+' '+r.start+(r.end!==r.start?'-'+r.end:'')),el('span',r.comment));b.onclick=()=>{const row=wrap.querySelector('[data-highlights~="'+i+'"]');if(row){wrap.scrollTop=row.getBoundingClientRect().top-wrap.getBoundingClientRect().top+wrap.scrollTop-42;row.focus({preventScroll:true})}};notes.append(b)});body.append(notes)}box.append(body);requestAnimationFrame(()=>{const row=wrap.querySelector('.focus');if(row)wrap.scrollTop=row.getBoundingClientRect().top-wrap.getBoundingClientRect().top+wrap.scrollTop-42});return box}
function render(){nav();const v=$('view');v.replaceChildren();if(tab==='description'){v.append(el('h2',D.title));const a=el('a','Source PR '+D.number);a.href=D.description.source_url;a.target='_blank';a.rel='noopener noreferrer';v.append(a);const facts=el('div',undefined,'facts');['@'+D.author,D.base+' ← '+D.head,'+'+D.additions+' / -'+D.deletions+' · '+D.files.length+' files',D.head_sha].forEach(s=>facts.append(el('span',s)));v.append(facts,el('p',D.description.summary,'summary'));if(D.description.attention?.length)v.append(attention(D.description.attention));v.append(el('h3','Original PR description'),el('p','Verbatim Markdown. Validation statements are attributed to the PR, not rerun here.','legend'),el('pre',D.description.body,'description-body'));return}if(tab==='files'){v.append(el('h2','All changed files'),el('p','Complete captured patches. Code panels scroll horizontally and vertically. Binary patches are unavailable.','legend'));D.files.forEach(f=>v.append(fileBlock(f)));return}const l=D.layers[index];v.append(el('h2',l.title));const des=el('div',undefined,'layer-description');des.append(el('strong',(l.type==='behavior'?'Behavior change':l.type==='design'?'Design choice':'Supporting changes')+': '),el('span',l.description));v.append(des);if(l.attention?.length)v.append(attention(l.attention));const tools=el('div',undefined,'toolbar'),mark=el('button',read.has(index)?'✓ Marked read':'Mark read');mark.onclick=()=>{read.has(index)?read.delete(index):read.add(index);render()};const label=el('label'),cb=el('input');cb.type='checkbox';cb.checked=focus;cb.onchange=()=>{focus=cb.checked;render()};label.append(cb,el('span','Dim context'));tools.append(mark,label);v.append(tools);l.refs.forEach(r=>v.append(fileBlock(D.files.find(f=>f.path===r.path),r.highlights)))}
D.files.forEach((f,i)=>{const b=el('button',f.status.slice(0,1).toUpperCase()+' '+f.path);b.onclick=()=>{tab='files';render();$('file-'+i).scrollIntoView({block:'start'})};$('tree').append(b)});$('all').onclick=()=>{tab='files';render()};$('reset').onclick=()=>{read.clear();selected.clear();focus=false;index=0;tab='layer';render()};render();
</script></body></html>
