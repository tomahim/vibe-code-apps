/* ==== ten distinct scroll-story mechanisms ==== */
.story{position:relative}
.story-stage{position:sticky;top:0;height:100vh;min-height:560px;overflow:hidden}
.sc .visual-kicker{position:absolute}
/* shared step nav + copyline */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:26px 0 18px}
.steps button{border:1px solid var(--line);background:#fff8;border-radius:10px;padding:9px 10px;text-align:left;font:12px/1.2 inherit;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.steps button span{font-size:10px;color:var(--muted);letter-spacing:.08em}
.steps button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps button[aria-pressed="true"] span{color:#fff9}
.steps.dots{grid-template-columns:repeat(6,1fr)}
.story-meter{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-bottom:8px}
.story-copyline .illustrative{color:var(--muted)}
/* 01 pinned split with parallax growth */
.m-pin{height:640vh}
.m-pin .story-stage{display:grid;grid-template-columns:1.2fr 1fr}
.m-pin .pin-visual{position:relative;overflow:hidden;border-right:1px solid var(--line)}
.m-pin .pin-bg{position:absolute;inset:0}
.m-pin .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16}
.m-pin .bg-lush{opacity:calc(var(--p)*.34)}
.m-pin .sc{position:absolute;inset:0;opacity:0;transform:translateY(46px) scale(.97);transition:opacity .55s ease,transform .55s ease;pointer-events:none}
.m-pin .sc.active{opacity:1;transform:none}
.m-pin .sc.active .planet-main{transform:translateY(calc(var(--lp)*-18px))}
.m-pin .sc.active .learning-card.front-card{transform:rotate(-2deg) translateY(calc(var(--lp)*-14px))}
.m-pin .story-copyline{padding:12vh 7vw 0}
.m-pin .story-copyline h2{font:44px/1.08 Georgia,serif;margin:18px 0 14px;letter-spacing:-.01em}
.m-pin .story-copyline p{color:var(--muted);max-width:42ch}
/* 02 circular portal zoom */
.m-portal{height:680vh;background:var(--ink);color:var(--paper)}
.m-portal .portal-wrap{position:absolute;inset:0}
.m-portal .portal-win{position:absolute;inset:0;overflow:hidden}
.m-portal .p-scene{position:absolute;left:50%;top:50%;width:min(72vh,86vw);height:min(72vh,86vw);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;opacity:0;background:var(--wash);color:var(--ink);box-shadow:0 40px 120px #0009}
.m-portal .p-scene .visual-kicker{top:9%}
.m-portal .portal-ring{position:absolute;left:50%;top:50%;width:min(72vh,86vw);height:min(72vh,86vw);transform:translate(-50%,-50%);border-radius:50%;border:1px solid #f3f0e655;z-index:3;pointer-events:none}
.m-portal .portal-ring::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px dashed #f3f0e633}
.m-portal .portal-glare{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 40%,#203d31cc 78%);pointer-events:none;z-index:2}
.m-portal .portal-copy{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 6vw 5vh;text-align:center}
.m-portal .portal-copy .eyebrow{color:#f3f0e6aa;justify-content:center}
.m-portal .portal-copy h2{font:40px/1.1 Georgia,serif;margin:10px 0 8px}
.m-portal .portal-copy p{color:#f3f0e6bb;max-width:52ch;margin:0 auto 14px}
.m-portal .steps.dots{max-width:520px;margin:0 auto 10px}
.m-portal .steps button{justify-content:center;background:transparent;border-color:#f3f0e644;color:var(--paper)}
.m-portal .steps button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.m-portal .story-count{color:#f3f0e677;letter-spacing:.2em}
/* 03 stacking field-note sheets */
.m-stack{padding:0 5vw 40vh;max-width:1180px;margin:0 auto}
.m-stack .stack-intro{padding:14vh 0 8vh;max-width:52ch}
.m-stack .stack-intro p{color:var(--muted)}
.m-stack .sheet{position:sticky;top:calc(84px + var(--i)*16px);background:#fbf8ee;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #203d3122;margin:0 0 42vh;padding:0;transform:rotate(calc((var(--i) - 2.5)*.6deg));overflow:hidden}
.m-stack .sheet:last-of-type{margin-bottom:12vh}
.m-stack .sheet header{display:flex;justify-content:space-between;padding:16px 26px;border-bottom:1px dashed var(--line);color:var(--muted)}
.m-stack .sheet-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.m-stack .sheet-body{display:grid;grid-template-columns:1.05fr 1fr;min-height:56vh}
.m-stack .sheet-visual{position:relative;background:var(--wash);min-height:320px}
.m-stack .sheet-copy{padding:34px 30px}
.m-stack .sheet-copy h2{font:30px/1.15 Georgia,serif;margin:0 0 12px}
.m-stack .sheet-copy p{color:var(--muted)}
.m-stack .stack-rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.m-stack .stack-rail button{border:1px solid var(--line);background:#fffdf6dd;border-radius:8px;font-size:10px;padding:5px 8px;cursor:pointer;color:var(--ink)}
.m-stack .stack-rail button span{display:none}
.m-stack .stack-rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* 04 horizontal expedition */
.m-horiz{height:700vh}
.m-horiz .track{display:flex;width:600%;height:100%;transform:translateX(calc(var(--p)*-83.3333%))}
.m-horiz .slide{width:calc(100%/6);height:100%;position:relative;display:grid;grid-template-columns:1.15fr 1fr;align-items:stretch}
.m-horiz .slide-visual{position:relative;overflow:hidden}
.m-horiz .slide-copy{padding:16vh 6vw 14vh;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.m-horiz .slide-copy h2{font:38px/1.1 Georgia,serif;margin:12px 0}
.m-horiz .slide-copy p{color:var(--muted)}
.m-horiz .tide{position:absolute;left:0;right:0;bottom:0;height:60px;z-index:4}
.m-horiz .tide svg{position:absolute;inset:0;width:100%;height:100%;stroke:#203d3133;stroke-width:2}
.m-horiz .tide-fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:calc(var(--p)*100%)}
.m-horiz .boat{position:absolute;bottom:14px;left:calc(var(--p)*96%);font-size:22px;transform:translateX(-50%)}
.m-horiz .horiz-rail{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:4}
.m-horiz .horiz-rail button{border:1px solid var(--line);background:#fffdf6cc;border-radius:999px;padding:6px 12px;font-size:11px;cursor:pointer;color:var(--ink)}
.m-horiz .horiz-rail button span{color:var(--muted);margin-right:6px}
.m-horiz .horiz-rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.m-horiz .horiz-rail button[aria-pressed="true"] span{color:#fff9}
/* 05 curiosity mosaic */
.m-mosaic{height:640vh}
.m-mosaic .story-stage{display:grid;grid-template-columns:1.25fr 1fr}
.m-mosaic .mosaic-grid{position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(2,1fr);gap:14px;padding:10vh 5vw;perspective:1200px}
.m-mosaic .tile{position:relative;transform-style:preserve-3d}
.m-mosaic .tile-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.m-mosaic .tile.on .tile-inner{transform:rotateY(180deg)}
.m-mosaic .tile-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.m-mosaic .tile-front{background:#fffdf6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.m-mosaic .tile-front span{font-size:11px;letter-spacing:.2em}
.m-mosaic .tile-front b{font:20px Georgia,serif;color:var(--ink)}
.m-mosaic .tile-back{transform:rotateY(180deg);background:var(--wash)}
.m-mosaic .tile-back .visual-kicker,.m-mosaic .tile-back .visual-caption{display:none}
.m-mosaic .mosaic-copy{padding:14vh 6vw 0}
.m-mosaic .mosaic-copy h2{font:40px/1.1 Georgia,serif;margin:16px 0 12px}
.m-mosaic .mosaic-copy p{color:var(--muted)}
.m-mosaic .t-worlds{grid-area:1/1}.m-mosaic .t-paths{grid-area:1/2}.m-mosaic .t-cards{grid-area:2/1}.m-mosaic .t-quiz{grid-area:2/2}.m-mosaic .t-review{grid-area:3/1}.m-mosaic .t-badges{grid-area:3/2}
/* 06 growing seasons */
.m-seasons{height:680vh}
.m-seasons .season-bg{position:absolute;inset:0}
.m-seasons .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-seasons .bg-lush{opacity:var(--p)}
.m-seasons .season-veil{position:absolute;inset:0;background:linear-gradient(#f3f0e622,#203d3140)}
.m-seasons .chapters{position:absolute;inset:0}
.m-seasons .chapter{position:absolute;left:50%;bottom:12vh;transform:translate(-50%,30px);width:min(620px,88vw);background:#fbf8eee8;border:1px solid var(--line);border-radius:16px;padding:30px 34px;opacity:0;clip-path:inset(0 0 100% 0);transition:opacity .5s,transform .5s,clip-path .6s ease;text-align:center}
.m-seasons .chapter.active{opacity:1;transform:translate(-50%,0);clip-path:inset(0 0 0 0)}
.m-seasons .chapter h2{font:32px/1.15 Georgia,serif;margin:10px 0}
.m-seasons .chapter p{color:var(--muted);margin:0}
.m-seasons .season-meter{position:absolute;left:5vw;top:18vh;bottom:18vh;width:2px;background:#f3f0e644;z-index:3}
.m-seasons .season-meter i{position:absolute;left:0;top:0;width:100%;height:calc(var(--p)*100%);background:var(--paper)}
.m-seasons .season-meter .story-count{position:absolute;top:calc(100% + 14px);left:-6px;color:#fff;letter-spacing:.18em;font-size:11px}
.m-seasons .season-rail{position:absolute;right:5vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3}
.m-seasons .season-rail button{border:1px solid #f3f0e655;background:#203d3155;color:var(--paper);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.m-seasons .season-rail button span{margin-right:6px;color:#fff8}
.m-seasons .season-rail button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
/* 07 museum drum */
.m-museum{height:680vh;background:#f8f4e9}
.m-museum .story-stage{display:grid;grid-template-columns:1.2fr 1fr}
.m-museum .drum-wrap{position:relative;display:flex;align-items:center;justify-content:center;perspective:1400px;overflow:hidden}
.m-museum .drum{position:relative;width:min(430px,44vw);height:46vh;transform-style:preserve-3d;transform:translateZ(-398px) rotateX(calc(var(--p)*-300deg))}
.m-museum .drum-panel{position:absolute;inset:0;background:#fffdf6;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;transform:rotateX(calc(var(--i)*60deg)) translateZ(398px);backface-visibility:hidden}
.m-museum .drum-visual{position:relative;flex:1;overflow:hidden;border-radius:8px;background:var(--wash)}
.m-museum .drum-visual .visual-caption{display:none}
.m-museum .drum-panel b{font:18px Georgia,serif}
.m-museum .drum-shadow{position:absolute;left:50%;bottom:12vh;width:420px;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse,#203d3126,transparent 70%)}
.m-museum .museum-copy{padding:14vh 6vw 0}
.m-museum .museum-copy h2{font:40px/1.1 Georgia,serif;margin:16px 0 12px}
.m-museum .museum-copy p{color:var(--muted)}
/* 08 winding path */
.m-path{position:relative;padding:10vh 6vw 20vh}
.m-path .trail-stage{position:sticky;top:0;height:100vh;z-index:0;pointer-events:none;margin-bottom:-100vh}
.m-path .trail{width:100%;height:100%}
.m-path .trail-line{stroke:var(--accent);stroke-width:3;stroke-dasharray:2 14;stroke-linecap:round;opacity:.55}
.m-path .trail-marker{fill:var(--accent)}
.m-path .trail-pulse{fill:none;stroke:var(--accent);opacity:.35}
.m-path .stops{position:relative;z-index:1}
.m-path .stop{width:min(430px,86vw);background:#fbf8eee6;border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin:0 0 34vh;box-shadow:0 14px 40px #203d3118;transition:transform .5s,opacity .5s;opacity:.55}
.m-path .stop.active{opacity:1;transform:scale(1.02);border-color:var(--accent)}
.m-path .stop-r{margin-left:auto}
.m-path .stop h2{font:26px/1.15 Georgia,serif;margin:8px 0}
.m-path .stop p{color:var(--muted);font-size:14px}
.m-path .stop-visual{position:relative;height:180px;overflow:hidden;border-radius:10px;background:var(--wash);margin-top:12px}
.m-path .stop-visual .visual-kicker,.m-path .stop-visual .visual-caption{display:none}
.m-path .trail-rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.m-path .trail-rail button{border:1px solid var(--line);background:#fffdf6dd;border-radius:999px;width:34px;height:34px;font-size:10px;cursor:pointer;color:var(--ink)}
.m-path .trail-rail button span{display:none}
.m-path .trail-rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* 09 daily ritual: calm dissolving chapters */
.m-ritual{height:640vh;background:var(--paper)}
.m-ritual .story-stage{display:flex;align-items:center;justify-content:center}
.m-ritual .rite{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + 26px));width:min(640px,88vw);text-align:center;opacity:0;transition:opacity .7s ease,transform .7s ease}
.m-ritual .rite.active{opacity:1;transform:translate(-50%,-50%)}
.m-ritual .rite-index{display:block;font:12px Georgia,serif;letter-spacing:.3em;color:var(--accent)}
.m-ritual .rite-kicker{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:10px 0 18px}
.m-ritual .rite h2{font:52px/1.12 Georgia,serif;margin:0 0 18px;letter-spacing:-.01em}
.m-ritual .rite p{color:var(--muted);max-width:46ch;margin:0 auto;font-size:16px}
.m-ritual .stem{position:absolute;left:50%;bottom:0;width:2px;height:34vh;transform:translateX(-50%);background:var(--line)}
.m-ritual .stem i{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--p)*100%);background:var(--accent)}
.m-ritual .ritual-rail{position:absolute;right:5vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.m-ritual .ritual-rail button{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted);background:transparent;cursor:pointer;padding:0}
.m-ritual .ritual-rail button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.m-ritual .story-count{position:absolute;left:5vw;bottom:8vh;letter-spacing:.24em;color:var(--muted)}
/* 10 world in your pocket: sticky phone */
.m-phone{padding:0 6vw 10vh}
.m-phone .phone-flow{display:grid;grid-template-columns:1fr 1fr;gap:5vw}
.m-phone .device{position:sticky;top:12vh;width:min(330px,80vw);height:min(620px,76vh);margin:0 auto;border:10px solid #22302a;border-radius:38px;background:#fbf8ee;overflow:hidden;box-shadow:0 30px 70px #203d3133;transform:rotate(-1.5deg)}
.m-phone .device-top{display:flex;justify-content:space-between;padding:10px 16px;font-size:11px;color:var(--muted)}
.m-phone .screen{position:relative;height:calc(100% - 34px)}
.m-phone .ms-wrap{position:absolute;inset:0;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}
.m-phone .ms-wrap.active{opacity:1;transform:none}
.m-phone .ms{padding:14px 18px;height:100%;display:flex;flex-direction:column;gap:10px}
.m-phone .ms header{font:13px Georgia,serif;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:8px}
.m-phone .ms p{font-size:12px;color:var(--muted);margin:0}
.m-phone .ms-art{width:100%;height:74px;object-fit:cover;border-radius:10px}
.m-phone .ms-art.wide{height:120px}
.m-phone .ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-phone .ms-path{display:flex;justify-content:space-between;padding:6px 10px}
.m-phone .ms-path i{width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:.4}
.m-phone .ms-path i:first-child{opacity:1}
.m-phone .ms-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.m-phone .ms-card b{font:14px Georgia,serif}
.m-phone .ms-card p{font-size:12px;margin:6px 0 0}
.m-phone .ms-quiz{display:flex;flex-direction:column;gap:8px}
.m-phone .ms-quiz b{font:14px Georgia,serif}
.m-phone .ms-quiz span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px}
.m-phone .ms-quiz .ok{border-color:var(--ink);background:var(--wash)}
.m-phone .ms-ring{width:110px;height:110px;border-radius:50%;border:8px solid var(--wash);border-top-color:var(--accent);margin:18px auto;display:flex;align-items:center;justify-content:center}
.m-phone .ms-ring b{font:28px Georgia,serif}
.m-phone .ms-medals{display:flex;justify-content:center;gap:12px;font-size:22px}
.m-phone .ms-medals i{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0dcae,#d9b36c);display:flex;align-items:center;justify-content:center;font-style:normal}
.m-phone .blocks{padding:6vh 0}
.m-phone .block{min-height:78vh;display:flex;flex-direction:column;justify-content:center;opacity:.35;transition:opacity .4s}
.m-phone .block.active{opacity:1}
.m-phone .block h2{font:34px/1.12 Georgia,serif;margin:10px 0}
.m-phone .block p{color:var(--muted);max-width:44ch}
.m-phone .phone-rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.m-phone .phone-rail button{border:1px solid var(--line);background:#fffdf6dd;border-radius:8px;font-size:10px;padding:5px 8px;cursor:pointer;color:var(--ink)}
.m-phone .phone-rail button span{display:none}
.m-phone .phone-rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

@media (max-width:960px){
 .m-pin .story-stage,.m-mosaic .story-stage,.m-museum .story-stage{grid-template-columns:1fr}

}
/* reduced motion: everything becomes a calm, static list */
@media (prefers-reduced-motion: reduce){

 .story .sc,.story .p-scene{position:static!important;opacity:1!important;transform:none!important;clip-path:none!important;margin:0 auto 26px;width:min(680px,92vw);height:auto;min-height:220px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
 .m-horiz .track{width:100%;transform:none!important;flex-direction:column}

 .m-museum .drum{transform:none!important;width:100%;height:auto}
 .m-museum .drum-panel{position:static;transform:none!important;margin-bottom:16px;height:auto}

}

const STORYRENDER=[storyPin,storyPortal,storyStack,storyHoriz,storyMosaic,storySeasons,storyMuseum,storyPath,storyRitual,storyPhone];

// --- scroll driver: one state contract, ten mechanics ---
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function initStory(){
 const story=$('.story');if(!story || reduced.matches)return;
 const origins = [...story.querySelectorAll('.sheet,.block,.stop')].map(e=>e.getBoundingClientRect().top+scrollY);
 const mech=story.dataset.mech;
 const scenes=[...story.querySelectorAll('[data-scene]')];
 const buttons=[...story.querySelectorAll('[data-step]')];
 const stage=story.querySelector('.story-stage');
 const copyI=story.querySelector('.step-index'),copyT=story.querySelector('.story-title'),copyD=story.querySelector('.story-desc'),copyN=story.querySelector('.story-count'),copyK=story.querySelector('.portal-copy .eyebrow');
 let lastStep=-1;
 function apply(step,p){
  const lp=clamp(p*6-step,0,1);const phase=clamp((lp-.67)/.33,0,1);const travel=clamp((step + phase*phase*(3-2*phase))/5,0,1);story.style.setProperty('--travel-p',travel);story.style.setProperty('--p',p);story.style.setProperty('--lp',lp);
  if(mech==='portal')portalMath(p);
  if(mech==='path')trailMath(p);
  if(step===lastStep)return;lastStep=step;
  scenes.forEach(s=>{s.classList.toggle('active',+s.dataset.scene===step);s.classList.toggle('passed',+s.dataset.scene<step)});
  buttons.forEach((b,i)=>b.setAttribute('aria-pressed',i===step));
  if(copyI)copyI.textContent='0'+(step+1);if(copyT)copyT.textContent=workflowTitles[step];if(copyD)copyD.textContent=workflowDetails[step];
  if(copyN)copyN.textContent='0'+(step+1)+' / 06';if(copyK)copyK.innerHTML=`<span class="step-index">0${step+1}</span> / ${KICKERS[step]}`;
  if(mech==='mosaic')scenes.forEach(s=>s.classList.toggle('on',+s.dataset.scene<=step));
 }
 function portalMath(p){story.querySelectorAll('.p-scene').forEach(s=>{const i=+s.dataset.scene;const l=p*6-i;let sc,op;if(l<=0){sc=.6;op=i===0?1:0}else if(l<.8){sc=.6+l*.55;op=Math.min(1,l/.25)}else if(l<1){sc=1.04+(l-.8)*1.3;op=1}else{sc=1.3+(l-1)*2.4;op=clamp(1-(l-1)*2.2,0,1)}s.style.transform=`translate(-50%,-50%) scale(${sc.toFixed(3)})`;s.style.opacity=op.toFixed(3)})}
 const trail=story.querySelector('.trail-line'),marker=story.querySelector('.trail-marker'),pulse=story.querySelector('.trail-pulse');
 let trailLen=0;if(trail)trailLen=trail.getTotalLength();
 function trailMath(p){if(!trail)return;const pt=trail.getPointAtLength(p*trailLen);marker.setAttribute('cx',pt.x);marker.setAttribute('cy',pt.y);pulse.setAttribute('cx',pt.x);pulse.setAttribute('cy',pt.y)}
 // progress measurement per mechanism
 function pSticky(){const r=story.getBoundingClientRect();const top=parseFloat(getComputedStyle(stage).top)||0;const span=story.offsetHeight-stage.offsetHeight;return clamp((top-r.top)/(span||1),0,1)}
 function measure(){
  if(reduced.matches)return 0;
  if(stage)return pSticky();
  const r=story.getBoundingClientRect();
  if(mech==='stack'||mech==='phone'){const items=story.querySelectorAll(mech==='stack'?'.sheet':'.block');let step=0;items.forEach((el,i)=>{if(origins[i]-scrollY<parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome'))+(innerHeight-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome')))*.5)step=i});return (step+.35)/6}
  if(mech==='path'){const items=[...story.querySelectorAll('.stop')];const cy=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome'));const aim=scrollY+cy+(innerHeight-cy)*.5;let best=0,dist=Infinity;items.forEach((el,i)=>{const d=Math.abs(origins[i]+el.offsetHeight/2-aim);if(d<dist){dist=d;best=i}});return (best+.4)/6}
  return 0;
 }
 function yFor(step){
  const docTop=story.getBoundingClientRect().top+scrollY;const p=(step+.4)/6;
  if(stage){const top=parseFloat(getComputedStyle(stage).top)||0;return docTop-top+(story.offsetHeight-stage.offsetHeight)*p}
  if(mech==='stack'){const sheet=story.querySelectorAll('.sheet')[step];return origins[step]-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome'))-14-step*9}
  if(mech==='phone'){const b=story.querySelectorAll('.block')[step];return origins[step]-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome'))}
  if(mech==='path'){const el=story.querySelectorAll('.stop')[step];const cy=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome'));return origins[step]+el.offsetHeight/2-cy-(innerHeight-cy)*.5}
  return docTop;
 }
 buttons.forEach(b=>b.addEventListener('click',()=>{const step=+b.dataset.step;if(reduced.matches){apply(step,(step+.4)/6);return}window.scrollTo({top:yFor(step),behavior:reduced.matches?'instant':'smooth'})}));
 let pending=false;
 const tick=()=>{pending=false;const r=story.getBoundingClientRect();story.classList.toggle('in-view',r.top<innerHeight*.75 && r.bottom>innerHeight*.35);const p=clamp(measure(),0,1);apply(Math.min(5,Math.floor(p*6)),p)};
 const queue=()=>{if(!pending){pending=true;requestAnimationFrame(tick)}};
 addEventListener('scroll',queue,{passive:true});addEventListener('resize',queue);tick();
 const old=cleanup;cleanup=()=>{old();removeEventListener('scroll',queue);removeEventListener('resize',queue)};
}

function reducedStory(c){return `<section class="story reduced-story" data-mech="reduced">${[0,1,2,3,4,5].map(i=>`<article class="reduced-chapter" data-scene="${i}"><div class="reduced-art">${sceneInner(i,c.theme)}</div><div><span class="tiny">0${i+1} / ${STEPNAMES[i]}</span><h2>${workflowTitles[i]}</h2><p>${workflowDetails[i]}</p></div></article>`).join('')}</section>`}
function fitIllustrations(){
 const els=[...document.querySelectorAll('.illustration')];
 const resize=()=>{els.forEach(el=>{const w=el.clientWidth,h=el.clientHeight;el.style.setProperty('--fit',Math.min(w/600,h/400)*.96)})};
 const ro=new ResizeObserver(resize);els.forEach(el=>ro.observe(el));resize();
 const old=cleanup;cleanup=()=>{old();ro.disconnect()};
}
function fitChrome(){const h=document.querySelector('.lab').getBoundingClientRect().height;const n=document.querySelector('.site-nav').getBoundingClientRect().height;document.documentElement.style.setProperty('--lab-h',h+'px');document.documentElement.style.setProperty('--chrome',(h+n)+'px')}

function home(c){const worlds=['ocean','biology','history'];return `<main id="main"><section class="hero"><span class="hero-number">04</span><div class="hero-copy"><div class="eyebrow">A world worth knowing</div><h1>${c.headline}</h1><p>${c.desc}</p><form class="signup"><label for="signup-email">Be first to explore &middot; pre-release list</label><div><input id="signup-email" type="email" placeholder="Your email address" autocomplete="email" required aria-label="Email address for prerelease preview"><button type="button" data-preview-signup>Join the list &nearr;</button></div><small>Design preview only. Your email is not sent or saved.</small></form><div class="hero-actions"><button class="pill" data-join>Find your first world <span>&nearr;</span></button><a href="#journey">Explore Cultive &darr;</a></div></div><div class="hero-art"><div class="orbit"></div><div class="portal-circle"></div><div class="phone-shell"><div class="phone-top"><span>9:41</span><span>&#9679; &#9679; &#9644;</span></div><h3>Good morning,<br>curious mind.</h3><div class="phone-cards"><div>Continue learning <b>&nearr;</b></div><div>Your daily review <b>3 ideas</b></div><div>Explore a new world <b>+</b></div></div></div>${art(c.theme)}${art('ocean','lush','hero-mini')}<div class="floating-note"><b>${c.note}</b><span class="tiny">One lesson. One small discovery.</span></div><div class="art-label">${c.art}<span>Let it grow.</span></div><div class="journal-caption">Notes from a curious world.</div></div><div class="hero-foot"><span><i class="scrollicon">&darr;</i> Scroll to see how it works</span><span>Read &middot; Play &middot; Remember</span></div></section>
<section class="benefits" aria-label="The Cultive rhythm">${[['01','Learn something small','One idea, given room to breathe.'],['02','Make remembering playful','A question that brings it back.'],['03','Grow a world of knowledge','A place for every curiosity.']].map(x=>`<div class="benefit reveal"><span class="num">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</section>
<section id="journey" class="chapter-intro reveal"><div class="eyebrow">The Cultive rhythm</div><h2>${c.chapter}</h2><p>Not everything you learn needs to be big.<br>Sometimes it just needs a place to grow.</p></section>
${reduced.matches?reducedStory(c):STORYRENDER[selected](c)}
<div class="ticker" aria-hidden="true">${Array(5).fill('<span>Biology &nbsp;&#10035;&nbsp; Ocean &nbsp;&#10035;&nbsp; History &nbsp;&#10035;&nbsp; Art &nbsp;&#10035;&nbsp; Space &nbsp;&#10035;&nbsp; The mind &nbsp;&#10035;&nbsp;</span>').join('')}</div>
<section class="explore"><div class="section-head reveal"><div><div class="eyebrow" style="margin-bottom:20px">Follow your curiosity</div><h2>Which world<br>is calling <em>you?</em></h2></div><p>A whole atlas of things to understand.<br>Try a world to preview its growth.</p></div><div class="world-grid">${worlds.map((w,i)=>`<button class="world-card reveal" data-world="${w}"><header><span>World / 0${i+1}</span><span>Explore &nearr;</span></header>${art(w,'lush','')}<h3>${['The ocean','Living things','Human stories'][i]}</h3><p>${['A little deeper. A little more wonder.','Life, in all its beautiful complexity.','The ideas and lives that shaped us.'][i]}</p></button>`).join('')}</div></section>
<section class="practice reveal"><div><div class="eyebrow">Small lessons. Lasting ideas.</div><h2>Knowing feels<br>better when<br>it <em style="color:#d4bb8e">stays.</em></h2><p>Read something interesting. Try a playful question. Come back to the idea, and watch your world grow.</p></div><div class="quiz"><div class="tiny">Try a tiny review / example</div><h3>The rise of oxygen in Earth's early atmosphere was driven by...</h3><button data-answer="wrong">The first forests</button><button data-answer="correct">Tiny photosynthetic organisms</button><button data-answer="wrong">Volcanic eruptions</button><div class="quiz-feedback" aria-live="polite">An example of how a little question can bring an idea back.</div><span class="tiny">Example science: NASA Astrobiology, "Revisiting Earth's Oxygenation" (2018).</span></div></section>
<section class="ending reveal"><div class="eyebrow">Your world starts small</div><h2>Make a little room<br>for <em>wonder.</em></h2><p>You do not have to know everything.<br>Just stay a little curious.</p><button class="pill" data-join>Find your first world <span>&nearr;</span></button></section></main>${footer()}`}
function placeholder(c){let p=pages[page];return `<main class="placeholder"><a href="#home" data-page="Home" class="tiny">&larr; Back to this homepage</a><div class="eyebrow">Cultive / ${c.name}</div><span class="status">Future page &middot; placeholder</span><h1 style="margin-top:25px">${page}</h1><p class="desc">${p.desc}</p><button class="pill" data-page="Home">Return to the world <span>&nearr;</span></button>${art(c.theme,'lush','ghost')}<div class="placeholder-boxes">${p.blocks.map((b,i)=>`<section><span>0${i+1}</span><h3>${b[0]}</h3><p>${b[1]}</p></section>`).join('')}</div></main>${footer()}`}
function heroParallax(){const hero=$('.hero');if(!hero)return;const set=()=>{const ht=hero.getBoundingClientRect();document.documentElement.style.setProperty('--travel',reduced.matches?0:Math.min(1,Math.max(0,-ht.top/ht.height)))};addEventListener('scroll',set,{passive:true});set();const old=cleanup;cleanup=()=>{old();removeEventListener('scroll',set)}}
function route(next,keep=false){cleanup();observer?.disconnect();cleanup=()=>{};page=next;const c=concepts[selected];document.body.className='mode-'+selected;document.documentElement.style.setProperty('--travel','0');$('#app').innerHTML=`<div class="concept-note"><strong>${String(selected+1).padStart(2,'0')} / ${c.name}</strong><span>${c.tag}</span><span class="motion">${MECHS[selected].label}</span></div>${nav()}${page==='Home'?home(c):placeholder(c)}`;document.querySelectorAll('.lab-tabs button').forEach((b,i)=>b.setAttribute('aria-selected',i===selected));document.title=`Cultive / ${c.name}${page==='Home'?'':' / '+page}`;if(!keep)window.scrollTo({top:0,behavior:'instant'});bind();fitChrome();if(page==='Home'){fitIllustrations();initStory();heroParallax()}}
function bind(){document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();route(a.dataset.page)}));document.querySelectorAll('.signup').forEach(f=>{const preview=()=>{if(f.querySelector('input').reportValidity())toast('Preview only. Your email has not been sent or saved.')};f.querySelector('[data-preview-signup]').addEventListener('click',preview);f.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();preview()}});f.addEventListener('submit',e=>e.preventDefault())});document.querySelectorAll('[data-join]').forEach(b=>b.addEventListener('click',()=>toast('Design preview only. No signup or personal data is collected.')));document.querySelectorAll('[data-world]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.world;document.querySelectorAll('.planet-main img,.path-island').forEach(im=>{im.src=ASSETS[t].lush;im.alt=`${t} knowledge island`});const pm=$('.planet-main>span');if(pm)pm.textContent=t;$('#journey').scrollIntoView({behavior:reduced.matches?'instant':'smooth'});toast(`${t.charAt(0).toUpperCase()+t.slice(1)} selected. Scroll through the learning journey.`)}));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(b.dataset.answer);$('.quiz-feedback').textContent=b.dataset.answer==='correct'?'Yes. Photosynthetic microbes began oxygenating the atmosphere long before forests existed.':'A good guess. Think smaller: photosynthetic microbes were making oxygen long before forests.'}));observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(e=>observer.observe(e))}
addEventListener('resize',fitChrome);
let timer;function toast(s){clearTimeout(timer);$('.toast').textContent=s;$('.toast').classList.add('show');timer=setTimeout(()=>$('.toast').classList.remove('show'),4200)}
$('.lab-tabs').innerHTML=concepts.map((c,i)=>`<button role="tab" aria-selected="${i===0}" id="concept-${i}" tabindex="0"><span>${String(i+1).padStart(2,'0')}</span>${c.name}</button>`).join('');document.querySelectorAll('.lab-tabs button').forEach((b,i)=>{b.addEventListener('click',()=>{selected=i;route('Home');b.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'nearest',inline:'center'})});b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?9:(i+(e.key==='ArrowRight'?1:9))%10;document.querySelectorAll('.lab-tabs button')[n].click();document.querySelectorAll('.lab-tabs button')[n].focus()}})});route('Home');
</script></body></html>
