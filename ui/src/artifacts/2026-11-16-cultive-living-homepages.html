function animate(){let lastY=window.scrollY,pending=false;const hero=$('.hero'),story=$('.scroll-story'),pin=$('.story-pin');const tick=()=>{pending=false;let y=window.scrollY;if(y!==lastY){manual=null;lastY=y}let ht=hero.getBoundingClientRect();document.documentElement.style.setProperty('--travel',reduced.matches?0:Math.min(1,Math.max(0,-ht.top/ht.height)));let r=story.getBoundingClientRect(),offset=parseFloat(getComputedStyle(pin).top)||180;let p=Math.min(1,Math.max(0,(offset-r.top)/(r.height-pin.offsetHeight)));if(reduced.matches)p=0;updateGrowth(manual===null?p:manual)};const queue=()=>{if(!pending){pending=true;frame=requestAnimationFrame(tick)}};window.addEventListener('scroll',queue,{passive:true});window.addEventListener('resize',queue);tick();cleanup=()=>{cancelAnimationFrame(frame);window.removeEventListener('scroll',queue);window.removeEventListener('resize',queue);observer?.disconnect()}}

let timer;function toast(s){clearTimeout(timer);$('.toast').textContent=s;$('.toast').classList.add('show');timer=setTimeout(()=>$('.toast').classList.remove('show'),4200)}
$('.lab-tabs').innerHTML=concepts.map((c,i)=>`<button role="tab" aria-selected="${i===0}" id="concept-${i}" tabindex="0"><span>${String(i+1).padStart(2,'0')}</span>${c.name}</button>`).join('');document.querySelectorAll('.lab-tabs button').forEach((b,i)=>{b.addEventListener('click',()=>{selected=i;route('Home');b.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'nearest',inline:'center'})});b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?9:(i+(e.key==='ArrowRight'?1:9))%10;document.querySelectorAll('.lab-tabs button')[n].click();document.querySelectorAll('.lab-tabs button')[n].focus()}})});route('Home');
</script></body></html>
