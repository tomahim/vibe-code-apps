<!doctype html>
<html lang="en">
<head>

<title>Little Grains — weekly leagues, 3 design concepts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}

.chrome{flex:none;background:#fffcf5;border-bottom:1px solid #dfd8c8;padding:8px 14px 0;z-index:10}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:thin}

.design{position:absolute;inset:0;overflow:hidden}
.design[hidden]{display:none}
.lg{--cream:#f5efe3;--paper:#fffcf5;--ink:#26342b;--dim:#6d7668;--line:#dfd8c8;--terra:#bd6748;--terra-d:#a64d34;--blue:#3b8dce;--orange:#ef8c32;--green:#5a9e5b;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);overflow:hidden}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#f8eddc}
.garden-ph{position:absolute;inset:0}

.qh{font:700 22px/1.25 var(--serif)}
.qmeta{font-size:11px;color:var(--dim);margin-top:4px}
.feed{margin-top:14px;font-size:13px;font-weight:700}

.chart{margin-top:16px;border:1px solid #e5ddc9;border-radius:14px;background:#f8f2e7;padding:14px}
.chart h4{font:700 14px var(--serif);color:#4d6a51;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;margin-top:6px;font-size:11px;font-weight:700;color:#5c645a}

.streak-hero{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(160deg,#fff6e6,#fbe8cd);border:1px solid #ecd9b8}
.streak-hero .flame{font-size:40px}

.streak-hero small{display:block;color:#9a7b4f;font-size:12px;margin-top:2px}
.mtrack{height:8px;background:#efe6d2;border-radius:6px;overflow:hidden;margin-top:10px}
.mtrack span{display:block;height:100%;background:linear-gradient(90deg,#7ea86a,#5a9e5b)}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
details.oq{margin-top:18px;border:1px solid #e3d8c6;border-radius:14px;background:#fbf7ec;padding:12px 14px}

.medal{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd98c,#f0a13c);display:grid;place-items:center;font-size:21px;border:2px solid #d88f2e;position:relative;flex:none}
.medal:hover{filter:brightness(1.05)}
.medal .tr{position:absolute;right:-5px;bottom:-5px;background:#5a9e5b;color:#fff;font-size:9px;border-radius:6px;padding:1px 4px;font-weight:800;border:1.5px solid #fffcf5}
.tiers{margin-top:16px;display:grid;gap:8px}
.tier{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fbf7ee}
.tier.cur{border-color:#e0a34c;background:#fdf3e0;box-shadow:0 4px 14px rgba(224,163,76,.18)}
.tier .ic{font-size:22px}
.tier b{font:700 15px var(--serif)}
.tier span{margin-left:auto;font-size:11px;color:var(--dim);text-align:right}
.sunarc{margin-top:16px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:20px 0 4px}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium .step{width:78px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#f3e8cf,#e8d9b8);border:1px solid #dcccab;border-bottom:0;display:grid;place-items:center;font:800 18px var(--serif);color:#8a7a5c}
.podium .p1 .step{height:88px}.podium .p2 .step{height:64px}.podium .p3 .step{height:48px}
.podium .av{width:40px;height:40px;border-radius:50%;background:#dce6d3;color:#4d6a51;display:grid;place-items:center;font-weight:800}

.podium .nm{font-size:11px;font-weight:700;color:#5b6157}
.podium .psc{font-size:10px;color:#98a094;font-variant-numeric:tabular-nums}
.pop{position:absolute;top:66px;right:14px;z-index:45;width:min(350px,calc(100% - 28px));background:var(--paper);border:1px solid #e0d4bd;border-radius:16px;box-shadow:0 18px 50px rgba(42,39,26,.22);padding:16px 18px;animation:pop .18s ease}
.pop .p-head h2{font-size:22px}
.pop .chart{padding:12px;margin-top:12px}
.room{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,#f3ecdc 0%,#eee2c8 100%);display:flex;flex-direction:column;animation:fade .2s ease}

.rbody{flex:1;overflow:auto;padding:18px 14px 30px}
.chalcard{margin:0 auto 18px;max-width:540px;background:var(--paper);border:1px solid #e3d8c6;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px rgba(60,50,30,.1)}
.chalcard .ic{font-size:26px}

.chalcard button{margin-left:auto;flex:none;background:#7a4a8c;color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13px}
.shelfrow{display:flex;gap:8px;justify-content:center;padding:12px 2px 8px;border-bottom:6px solid #c9a97e;border-radius:3px;margin-bottom:16px;max-width:640px;margin-left:auto;margin-right:auto}
.plant{flex:1;min-width:0;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:12px;position:relative}

.plant .pn{font-size:10.5px;font-weight:700;color:#5b6157;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plant .ps{font-size:10px;color:#98a094;font-variant-numeric:tabular-nums}
.plant.up{background:rgba(126,168,106,.16);box-shadow:inset 0 0 0 1.5px #9fbf8d}
.plant.down{background:rgba(176,67,58,.1);box-shadow:inset 0 0 0 1.5px #d9a295}

@media(max-width:1000px){.hlabel{display:none}}
@media(max-width:760px){
  .gh{height:60px;padding:0 10px;gap:8px}

</style>

<body>
<header class="chrome">
  <div class="row"><h1>Little Grains — weekly leagues</h1><span class="sub">3 design concepts on the current app shell · demo data only, nothing stored · garden is an unchanged placeholder</span></div>
  <nav class="tabs" id="tabs" aria-label="Design concepts">
    <button class="tab" data-d="d1" aria-current="true"><small>01</small>Growth leagues</button>
    <button class="tab" data-d="d2" aria-current="false"><small>02</small>Seasons</button>
    <button class="tab" data-d="d3" aria-current="false"><small>03</small>Garden rooms</button>
  </nav>

<script>
"use strict";
/* Demo data — 24-player league, week 46 (Mon 9 – Sun 15 Nov), today Thursday. */
const PLAYERS=[
["Camille",142,31],["Hugo",129,30],["Mehdi",118,31],["Léa",110,30],["Gabriel",104,31],
["Emma",96,24],["Louis",76,19],["Thomas",68,18,"you"],["Aurore",64,17],["Chloé",60,18],
["Raphaël",55,19],["Manon",52,18],["Jules",49,17],["Sarah",45,16],["Adam",42,19],["Inès",39,19],
["Nathan",36,18],["Juliette",33,16],["Arthur",30,14],["Zoé",27,12],["Théo",22,12],["Eva",18,11],
["Rayan",12,10],["Alice",6,2]];
const score=p=>p[1]+p[2];
const selfRank=PLAYERS.findIndex(p=>p[3]==="you")+1;
const WEEK=["Mon 9","Tue 10","Wed 11","Thu 12","Fri 13","Sat 14","Sun 15"], TODAY=3;
const MY_DROPS=[12,9,15,12,0,0,0], MY_CARROTS=[3,1,4,2,0,0,0];
const MY8_D=[38,44,51,47,60,55,63,48], MY8_C=[9,12,10,14,11,15,13,10];
const CHAL_DONE=[["Aurore",3],["Camille",3],["Mehdi",2],["Léa",2],["Hugo",2],["Emma",1],["Gabriel",1],["Sarah",1],["Louis",1],["Arthur",0],["Inès",0]];
const QUESTIONS=[
 {q:"Which sentence is correct?",o:["She don't like coffee.","She doesn't likes coffee.","She doesn't like coffee.","She not like coffee."],a:2},
 {q:"What is the past tense of “to grow”?",o:["Growed","Grew","Growed up","Grown"],a:1},
 {q:"A group of stars forming a pattern is called…",o:["A galaxy","A nebula","A comet","A constellation"],a:3}];
const OQ=`<details class="oq"><summary>Open product questions (not decided — illustrative answers shown)</summary><ul>
<li>What moves you between leagues: drops, carrots, or a mix (and with what weights)? Concepts show an illustrative 💧+🥕 sum.</li>
<li>Exact league size inside 20–30, number of tiers, how many promote/relegate, tie-breaks.</li>
<li>What counts as "not practicing" enough to go down.</li>
<li>Settlement moment: "end of the week" vs the current Monday-reset leaderboard, and which timezone.</li>
<li>Whether challenge results feed league standing, or only weekly drops/carrots do.</li>
<li>With only a few real users today, a 20–30 league needs filler players or a later start.</li>

function hexes(){let s="";for(let r=0;r<7;r++)for(let c=0;c<9;c++){const x=60+c*86+(r%2?43:0),y=40+r*74;s+=`<polygon points="${hex(x,y,40)}"/>`;}return s;}
function hex(cx,cy,r){let p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));}return p.join(" ");}

/* ---- charts ---- */
function bars7(vals,color,label){const max=Math.max(...vals,1);const W=280,H=64,bw=26,gap=(W-7*bw)/8;
 const bars=vals.map((v,i)=>{const bh=Math.max(2,v/max*(H-16));const x=gap+i*(bw+gap);
 return `<rect x="${x}" y="${H-bh}" width="${bw}" height="${bh}" rx="4" fill="${i===TODAY?color:"#d9cdae"}"/>${i===TODAY?`<text x="${x+bw/2}" y="${H-bh-4}" text-anchor="middle" font-size="9" font-weight="800" fill="${color}">${v}</text>`:""}`;}).join("");
 return `<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="${label}">${bars}<text x="${gap+13}" y="${H+12}" text-anchor="middle" font-size="8" fill="#8a806b">M</text><text x="${gap+13+3*(bw+gap)}" y="${H+12}" text-anchor="middle" font-size="8" fill="#8a806b">T</text><text x="${gap+13+6*(bw+gap)}" y="${H+12}" text-anchor="middle" font-size="8" fill="#8a806b">S</text></svg>`;}
function spark(vals,color,w,hgt){w=w||280;hgt=hgt||54;const max=Math.max(...vals),min=Math.min(...vals);
 const px=i=>8+i*(w-16)/(vals.length-1), py=v=>hgt-8-(v-min)/(max-min||1)*(hgt-16);
 const line=vals.map((v,i)=>`${i?"L":"M"}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 ${w} ${hgt}"><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3" fill="#fffefa" stroke="${color}" stroke-width="1.8"/>`).join("")}<text x="${px(vals.length-1)}" y="${py(vals[vals.length-1])-7}" text-anchor="end" font-size="9" font-weight="800" fill="${color}">${vals[vals.length-1]}</text></svg>`;}
function dualChart(a,b){const W=300,H=110,max=Math.max(...a,...b);
 const px=i=>14+i*(W-28)/7, py=v=>H-14-(v/max)*(H-30);
 const path=vs=>vs.map((v,i)=>`${i?"L":"M"}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
 const area=`${path(a)} L${px(7)},${H-14} L${px(0)},${H-14} Z`;
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${area}" fill="rgba(59,141,206,.12)"/>
 <path d="${path(a)}" fill="none" stroke="#3b8dce" stroke-width="2.5" stroke-linecap="round"/>
 <path d="${path(b)}" fill="none" stroke="#ef8c32" stroke-width="2.5" stroke-linecap="round"/>
 ${a.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="2.6" fill="#fffefa" stroke="#3b8dce" stroke-width="1.6"/>`).join("")}
 ${b.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="2.6" fill="#fffefa" stroke="#ef8c32" stroke-width="1.6"/>`).join("")}
 <text x="${px(7)}" y="${py(a[7])-6}" text-anchor="end" font-size="9" font-weight="800" fill="#3b8dce">${a[7]}</text>
 <text x="${px(7)}" y="${py(b[7])+12}" text-anchor="end" font-size="9" font-weight="800" fill="#ef8c32">${b[7]}</text></svg>`;}

function runChallenge(section,renderResults){
 const old=section.querySelector(".c-backdrop");if(old)old.remove();
 let qi=0,good=0,timerId=null;
 const back=h(`<div class="c-backdrop"><div class="c-card" role="dialog" aria-modal="true" aria-label="Weekly challenge">
  <div class="c-top"><span class="c-kick">Weekly Challenge · Week 46 · Sprout league</span><button class="x" aria-label="Close challenge">×</button></div>
  <div class="c-body"></div></div></div>`);
 section.appendChild(back);
 const body=back.querySelector(".c-body");
 back.querySelector(".x").onclick=()=>{clearInterval(timerId);back.remove();};
 back.addEventListener("mousedown",e=>{if(e.target===back){clearInterval(timerId);back.remove();}});
 function question(){
  if(qi>=QUESTIONS.length){clearInterval(timerId);renderResults(body,good,()=>back.remove());return;}
  const Q=QUESTIONS[qi];let left=15;
  body.innerHTML=`<div class="qmeta">Question ${qi+1} of ${QUESTIONS.length} · demo uses 15s, real challenge 30s</div>
  <h3 class="qh">${esc(Q.q)}</h3><div class="timer"><span style="width:100%"></span></div>
  <div class="opts">${Q.o.map((o,i)=>`<button data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="feed"></div>`;
  const bar=body.querySelector(".timer span");const t0=Date.now();
  timerId=setInterval(()=>{const w=Math.max(0,100-(Date.now()-t0)/(left*10));bar.style.width=w+"%";if(w<=0){clearInterval(timerId);answer(-1);}},100);
  body.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{clearInterval(timerId);answer(+b.dataset.i);});
  function answer(i){
   body.querySelectorAll(".opts button").forEach(b=>{b.disabled=true;
    if(+b.dataset.i===Q.a)b.classList.add("correct");else if(+b.dataset.i===i)b.classList.add("wrong");});
   const ok=i===Q.a;if(ok)good++;
   const f=body.querySelector(".feed");f.className="feed "+(ok?"ok":"ko");
   f.textContent=ok?"That's right! +1 carrot":"Not quite.";
   qi++;setTimeout(question,900);
  }}
 question();}

  const rows=[];const sorted=[...PLAYERS];
  for(let r=0;r<sorted.length;r+=6){rows.push(sorted.slice(r,r+6));}
  return rows.map((row,ri)=>{const first=ri*6+1;
   const label=ri===0?"Promotion shelf — top 5 climb to the Orchard":ri===rows.length-1?"Relegation shelf — bottom 5 return to the Balcony":"";
   return `${label?`<p class="shelflab">${label}</p>`:""}<div class="shelfrow">${row.map((p,i)=>{const rk=first+i;
   const cls=p[3]==="you"?"me":rk<=5?"up":rk>PLAYERS.length-5?"down":"";
   return `<div class="plant ${cls}"><span class="rk">#${rk}</span><span class="pe">${PE[(rk*3)%PE.length]}</span><span class="pn">${esc(p[0])}${p[3]==="you"?" · you":""}</span><span class="ps">⚡${score(p)}</span>${p[3]==="you"&&played?`<span class="badge">⚔ #${chalPos()}</span>`:""}</div>`;}).join("")}</div>`;}).join("");}
 function chalPos(){const mine=[...CHAL_DONE,["Thomas",myScore]].sort((a,b)=>b[1]-a[1]);return mine.findIndex(r=>r[0]==="Thomas")+1;}
 function room(){
  if(sec.querySelector(".room"))return;
  const r=h(`<div class="room" role="dialog" aria-modal="true" aria-label="Greenhouse league room">
  <div class="rhead"><div><p class="k">Weekly league room</p><h2>🏡 Greenhouse</h2></div>
  <div class="weeklab" style="margin:0"><span>Week 46 · settles Sunday night</span></div><button class="x" aria-label="Close room">×</button></div>
  <div class="rbody">
   <div class="chalcard"><span class="ic">⚔</span><div><b>Weekly challenge — Greenhouse gardeners</b><p class="csub"></p></div><button data-play>Play</button></div>
   <div class="shelf-slot"></div>
   <div class="move-card"><b>Sunday moving day.</b> When the week settles, the top 5 plants climb to the 🍎 Orchard, the bottom 5 return to the 🪴 Balcony, and everyone keeps their drops and carrots. League names, shelf sizes and cutoffs are illustrative.</div>
   ${OQ}</div></div>`);
  sec.querySelector(".lg").appendChild(r);
  r.querySelector(".x").onclick=()=>r.remove();
  const sub=r.querySelector(".csub"),btn=r.querySelector("[data-play]");
  function refresh(){
   sub.textContent=played?`${CHAL_DONE.length+1} of 24 played · you ${myScore}/${QUESTIONS.length} · live #${chalPos()} — standings visible immediately`:`${CHAL_DONE.length} of 24 played · ranking goes live the moment you finish`;
   btn.textContent=played?"Replay":"Play";
   r.querySelector(".shelf-slot").innerHTML=shelfHTML();}
  btn.onclick=()=>runChallenge(sec,(body,good,close)=>{played=true;myScore=good;
   body.innerHTML=`<h3 class="qh">Challenge done — ${good}/${QUESTIONS.length}</h3>
   <div class="live-note"><b>Live:</b> your #${chalPos()} spot is already on the shelf — no waiting for the others.</div>
   <button class="pill" style="margin-top:18px;width:100%;justify-content:center" data-x>Back to the Greenhouse</button>`;
   body.querySelector("[data-x]").onclick=()=>{close();refresh();};});
  refresh();}
 function streakDrawer(){
  const old=sec.querySelector(".backdrop");if(old)old.remove();
  const b=h(`<div class="backdrop"><aside class="panel" role="dialog" aria-modal="true" aria-label="Daily streak">
  <div class="p-head"><div><p class="k">Grow a little, every day</p><h2>Daily streak</h2></div><button class="x" aria-label="Close">×</button></div>
  <div class="streak-hero"><span class="flame">🔥</span><div><b>12 days</b><small>3 more days to the 15-day milestone badge</small></div></div>
  <div class="mtrack"><span style="width:80%"></span></div><div class="mlab"><span>7 ✔</span><span>15 · 80%</span></div>
  <div class="chart"><h4>Growth rings — your 8 weeks <span>💧 drops · 🥕 carrots<span class="newtag">NEW</span></span></h4>${dualChart(MY8_D,MY8_C)}
  <div class="legend"><span><i style="background:#3b8dce"></i>Drops</span><span><i style="background:#ef8c32"></i>Carrots</span></div></div>
  <div class="chart"><h4>This week, day by day<span class="newtag">NEW</span></h4>${bars7(MY_DROPS,"#3b8dce","Drops this week")}${bars7(MY_CARROTS,"#ef8c32","Carrots this week")}</div></aside></div>`);
  sec.querySelector(".lg").appendChild(b);
  b.querySelector(".x").onclick=()=>b.remove();
  b.addEventListener("mousedown",e=>{if(e.target===b)b.remove();});}
 sec.addEventListener("click",e=>{const t=e.target.closest("[data-open]");if(!t)return;
  if(t.dataset.open==="league")room();
  if(t.dataset.open==="streak")streakDrawer();
  if(t.dataset.open==="challenge"){room();}
 });
 sec.dataset.ready="1";
})();

/* ---- tabs + deep links (#d1, #d2+league, #d3+streak ...) ---- */
function activate(id,open){
 document.querySelectorAll(".design").forEach(s=>s.hidden=s.id!==id);
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.d===id?"true":"false"));
 if(open){const sec=document.getElementById(id);const btn=sec.querySelector(`[data-open="${open}"]`);if(btn)setTimeout(()=>btn.click(),60);}}
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;
 activate(t.dataset.d);try{history.replaceState(null,"","#"+t.dataset.d);}catch(_){}});
(function(){const m=(location.hash||"").replace("#","").split("+");const id=["d1","d2","d3"].includes(m[0])?m[0]:"d1";
 activate(id,m[1]);})();
</script>
</body>
