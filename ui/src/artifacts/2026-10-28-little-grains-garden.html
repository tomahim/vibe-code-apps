<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Grains: Hex Garden</title>
<style>
:root{--cream:#f6efe3;--paper:#fffdf8;--ink:#2b2a28;--dim:#7d766a;--line:#e5dccb;--terra:#c65d3b;--terra-d:#a94a2c;--blue:#3f8fd2;--orange:#f08a24;--green:#5fa84a;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--cream);flex:none}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap}.brand small{display:block;font:600 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tabs{display:flex;gap:4px;margin-left:auto;padding:3px;background:#ece3d1;border-radius:999px}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim)}
.tab[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,10,.15)}.tab small{font-weight:500;opacity:.7;margin-left:4px}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0}.pane[hidden]{display:none}.mount{position:absolute;inset:0}
#pane-mobile{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fbf5ea,#eadfca)}#pane-mobile[hidden]{display:none}
#pane-mobile .mount{position:relative;inset:auto;width:min(390px,100%);height:min(844px,calc(100% - 28px));border-radius:34px;overflow:hidden;border:9px solid #2b2a28;box-shadow:0 30px 60px -20px rgba(60,40,10,.45)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:var(--dim);background:var(--cream);z-index:50}#loading[hidden]{display:none}
.lg-root{position:absolute;inset:0;overflow:hidden;background:#f8eddc;user-select:none;-webkit-user-select:none}
.lg-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.lg-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lg-label{position:absolute;left:0;top:0;transition:opacity .25s;white-space:nowrap;will-change:transform}
.lg-label.theme,.lg-label.cell{background:rgba(255,253,248,.93);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;text-align:center;box-shadow:0 4px 12px -4px rgba(60,40,10,.3)}
.lg-label.theme b{font:700 15px var(--serif)}.lg-label.cell b{font:700 12.5px var(--serif);display:block}
.lg-label .dots{display:flex;gap:3px;justify-content:center;margin-top:3px}
.lg-label.lesson{display:flex;align-items:center;gap:6px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:0 4px 12px -4px rgba(60,40,10,.3)}
.lg-label.lesson b{font:600 12px var(--sans)}.lg-label .n{font:700 12px var(--sans);font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9e1cd;color:var(--ink)}
.lg-label.lesson[data-state=done] .n{background:var(--green);color:#fff}.lg-label.lesson[data-state=cur] .n{background:var(--terra);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid #cdbf9f;background:transparent}.dot.on{background:var(--green);border-color:var(--green)}
.lg-lessons .dot.on,.dots.big .dot.on{background:var(--blue);border-color:var(--blue)}.dots{display:inline-flex;gap:3px;align-items:center}.dots.big{gap:6px;margin:6px 0}.dots.big .dot{width:13px;height:13px}
.lg-fade{position:absolute;inset:0;background:#f6efe3;opacity:0;pointer-events:none;transition:opacity .33s}.lg-fade.on{opacity:1}
.lg-crumbs{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:2px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:999px;padding:4px 8px;box-shadow:0 6px 16px -8px rgba(60,40,10,.3);max-width:calc(100% - 32px);overflow:hidden}
.lg-crumbs button{border:0;background:none;padding:5px 8px;border-radius:999px;font:600 13px var(--sans);white-space:nowrap;color:var(--dim)}.lg-crumbs button[aria-current=page]{color:var(--ink);font-family:var(--serif);font-size:14px}.lg-crumbs button:hover{background:#f1e9d8}
.lg-crumbs .sep{color:#bdb39d}.lg-crumbs .lg-back{font-size:20px;line-height:1;padding:2px 9px 4px;color:var(--terra)}
.lg-stats{position:absolute;top:14px;right:16px;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,253,248,.93);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;box-shadow:0 6px 16px -8px rgba(60,40,10,.3)}.chip b{font-variant-numeric:tabular-nums}.chip small{color:var(--dim);font-size:12px}
.chip.done,.lg-lesson .chip.done{background:#e3f1dc;border-color:#c9e2bd;box-shadow:none}.lg-lesson .chip.cur{background:#f8e0d6;border-color:#f0c4b3;box-shadow:none}.lg-lesson .chip.todo{background:#efe9db;box-shadow:none}.lg-lesson .chip{font-size:11px;padding:3px 9px;font-weight:600}
.lg-panel{position:absolute;left:16px;top:66px;width:320px;max-height:calc(100% - 150px);overflow:auto;background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;box-shadow:0 20px 40px -20px rgba(60,40,10,.4);backdrop-filter:blur(8px)}
.lg-handle{display:none}
.lg-panel .eyebrow{margin:0 0 4px;font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.lg-panel h2{margin:0 0 6px;font:700 26px/1.1 var(--serif)}.lg-panel .lede{margin:0 0 12px;font-size:13px;line-height:1.45;color:var(--dim)}
.lg-list,.lg-lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lg-list button,.lg-lessons button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 8px}
.lg-list button:hover,.lg-lessons button:hover{background:#f6efe1;border-color:var(--line)}
.lg-list .sw{width:22px;height:22px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}.lg-list .tt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.lg-list b{font:700 15px var(--serif)}.lg-list small{color:var(--dim);font-size:11.5px}
.lg-list .bar,.lg-lesson .bar{width:54px;height:6px;border-radius:3px;background:#ece3d1;overflow:hidden;flex:none;padding:0;border:0}.lg-list .bar i,.lg-lesson .bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.lg-list .pc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.lg-lessons .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);background:#ece3d1;flex:none}.lg-lessons .nm{flex:1;font-size:13px;font-weight:600;min-width:0}
.lg-lessons .done .num{background:var(--green);color:#fff}.lg-lessons .cur .num{background:var(--terra);color:#fff}.lg-lessons .sel{background:#f6efe1;border-color:var(--terra)}
.lg-lessons .dots .dot{width:6px;height:6px;border-width:1px}
.lg-lesson{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px;background:#fffaf0}.lg-lesson h3{margin:6px 0 0;font:700 18px/1.2 var(--serif)}.lg-lesson p{margin:2px 0 8px;font-size:12.5px;color:var(--dim)}
.primary{width:100%;margin-top:10px;border:0;border-radius:12px;padding:10px;background:var(--terra);color:#fff;font-weight:700;font-size:14px}.primary:hover{background:var(--terra-d)}
.lg-time{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:0 12px 28px -12px rgba(60,40,10,.4);width:min(520px,calc(100% - 32px))}
.lg-play,.lg-water{border:0;border-radius:999px;height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px}.lg-play{width:36px;background:var(--terra);color:#fff;flex:none}.lg-water{background:#e4f0fa;color:var(--blue);padding:0 14px;flex:none}
.lg-weekwrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0}.lg-weeklabel{font:700 13px var(--serif);min-width:54px;font-variant-numeric:tabular-nums}
.lg-week{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green) var(--fill,50%),#e6dcc8 var(--fill,50%))}
.lg-week::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--green);box-shadow:0 2px 6px rgba(0,0,0,.2)}.lg-week::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--green)}
.lg-toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}.lg-toast.on{opacity:1;transform:translate(-50%,0)}
.lg-error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--serif);font-size:18px;background:var(--cream)}.lg-error[hidden]{display:none}
/* Mobile profile */
.lg-mobile .lg-crumbs{top:10px;left:10px;right:10px;max-width:none;padding:3px 6px}.lg-mobile .lg-crumbs button{padding:5px 6px;font-size:12px}.lg-mobile .lg-crumbs button[aria-current=page]{font-size:13px}
.lg-mobile .lg-stats{top:56px;right:10px;left:10px;justify-content:flex-start}.lg-mobile .chip{padding:4px 10px;font-size:12px}
.lg-mobile .lg-panel{left:8px;right:8px;top:auto;bottom:64px;width:auto;max-height:30%;border-radius:18px 18px 14px 14px;padding:6px 14px 12px;transition:max-height .25s}.lg-mobile .lg-panel.open{max-height:64%}
.lg-mobile .lg-handle{display:block;width:100%;border:0;background:none;padding:6px 0 8px;position:sticky;top:0}.lg-mobile .lg-handle span{display:block;width:38px;height:4px;border-radius:2px;background:#d8ccb4;margin:0 auto}
.lg-mobile .lg-panel h2{font-size:21px}.lg-mobile .lg-panel .lede{font-size:12px;margin-bottom:8px}.lg-mobile .lg-time{bottom:10px;width:calc(100% - 20px)}.lg-mobile .lg-weeklabel{min-width:48px}.lg-mobile .lg-water span{display:none}.lg-mobile .lg-water{padding:0 11px}.lg-mobile .lg-toast{bottom:auto;top:96px}
.lg-mobile .lg-label.theme{padding:3px 8px;border-radius:10px}.lg-mobile .lg-label.theme b{font-size:12px}.lg-mobile .lg-label.cell{padding:3px 7px}.lg-mobile .lg-label.cell b{font-size:11px}
@media(max-width:760px){.bar{padding:8px 12px;gap:8px}.brand small{display:none}.brand{font-size:16px}.tab{padding:6px 10px;font-size:12px}.tab small{display:none}
#pane-mobile .mount{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
.lg-desktop .lg-panel{left:8px;right:8px;top:auto;bottom:64px;width:auto;max-height:34%}.lg-desktop .lg-stats{top:56px;left:10px;right:auto}.lg-desktop .lg-crumbs{left:10px;right:10px}}
.lg-zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}.lg-zoom button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,253,248,.94);font:600 20px/1 var(--sans);box-shadow:0 6px 16px -8px rgba(60,40,10,.4)}.lg-zoom button:hover{background:#f6efe1}
.lg-hint{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);font-size:12px;color:var(--dim);background:rgba(255,253,248,.85);border-radius:999px;padding:5px 12px;white-space:nowrap;transition:opacity .6s;pointer-events:none}.lg-hint.gone{opacity:0}
.lg-mobile .lg-zoom{right:10px;bottom:auto;top:96px}.lg-mobile .lg-zoom button{width:34px;height:34px}.lg-mobile .lg-hint{bottom:auto;top:96px;left:10px;transform:none;white-space:normal;max-width:60%;border-radius:10px}
@media(prefers-reduced-motion:reduce){.lg-fade,.lg-label,.lg-toast,.lg-panel{transition:none}}
</style>
</head>

<div class="app">
  <header class="bar">
    <div class="brand">Little Grains<small>The learning garden · sample data</small></div>
    <div class="tabs" role="tablist" aria-label="Garden version">
      <button class="tab" role="tab" data-tab="desktop" aria-selected="true" aria-controls="pane-desktop" id="tab-desktop">Desktop<small>detailed</small></button>
      <button class="tab" role="tab" data-tab="mobile" aria-selected="false" tabindex="-1" aria-controls="pane-mobile" id="tab-mobile">Mobile<small>simplified</small></button>
    </div>
  </header>
  <main>
    <section class="pane" id="pane-desktop" role="tabpanel" aria-labelledby="tab-desktop"><div class="mount"></div></section>
    <section class="pane" id="pane-mobile" role="tabpanel" aria-labelledby="tab-mobile" hidden><div class="mount"></div></section>
    <div id="loading" role="status">Planting the garden…</div>
  </main>
</div>
