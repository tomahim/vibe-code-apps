<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Megawatt Path</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c0a14; --panel:#15121f; --panel2:#1d1930; --line:#2f2947;
  --ink:#ece8f7; --muted:#a199bd; --faint:#6f6890;
  --violet:#b48cff; --cyan:#5ee6e0; --gold:#f2b66d; --pink:#ff6fa8; --green:#7fe3a0; --red:#ff7a7a;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;
  padding:12px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wordmark{pointer-events:auto}
.wordmark h1{margin:0;font:700 19px/1.15 Georgia,'Times New Roman',serif;letter-spacing:.02em;
  background:linear-gradient(92deg,#d9c8ff,#b48cff 45%,#5ee6e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark .sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
.meters{pointer-events:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{background:rgba(21,18,31,.88);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;font-size:11px;color:var(--muted);white-space:nowrap;backdrop-filter:blur(8px)}
.chip b{color:var(--cyan);font-weight:600}
.chip.pow b{color:var(--gold)}

/* step info panel */
#panel{position:fixed;z-index:11;left:12px;bottom:86px;width:min(330px,calc(100vw - 24px));
  background:rgba(21,18,31,.92);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s ease,opacity .25s ease}
#panel.hidden{transform:translateY(8px);opacity:0;pointer-events:none}
#panel .p-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
#panel .p-head .k{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--bg);background:var(--cyan);
  border-radius:6px;padding:4px 6px;letter-spacing:.06em}
#panel h2{margin:0;font:700 16px/1.2 Georgia,serif;flex:1}
#panel .min{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);
  min-width:32px;min-height:32px;font-size:14px}
#panel .p-body{padding:4px 12px 12px;max-height:34vh;overflow:auto}
#panel .p-body p{margin:6px 0;font-size:13px;color:var(--muted)}
#panel .p-body p b{color:var(--ink)}
#panel .honest{font-size:11px;color:var(--faint);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
#panel .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#panel .actions button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;
  padding:8px 10px;font-size:12px;min-height:40px}
#panel .actions button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
#panel .hint{font-size:11px;color:var(--faint);margin-top:8px}
#panel .srcs{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5}
#panel .srcs span{display:block}
#showpanel{position:fixed;z-index:11;left:12px;bottom:86px;border:1px solid var(--line);
  background:rgba(21,18,31,.92);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--muted);
  backdrop-filter:blur(10px);display:none;min-height:40px}
#showpanel.on{display:block}

/* annotation dots */
#dots{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.dot{position:absolute;pointer-events:auto;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  border:1.5px solid var(--cyan);background:rgba(12,10,20,.85);color:var(--cyan);
  font:600 13px/1 ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .2s;box-shadow:0 0 12px rgba(94,230,224,.25)}
.dot:hover{transform:scale(1.12)}
.dot.off{opacity:0;pointer-events:none}

/* bottom sheet */
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s ease;max-height:62vh;overflow:auto;
  box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px}
#sheet .close{position:absolute;top:10px;right:12px;background:none;border:1px solid var(--line);
  border-radius:8px;color:var(--muted);min-width:36px;min-height:36px}
#sheet h3{margin:2px 40px 2px 0;font:700 17px/1.25 Georgia,serif;color:var(--cyan)}
#sheet .stat{display:inline-block;margin:4px 0;font-size:12px;color:var(--gold);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel2)}
#sheet p{margin:8px 0;font-size:13.5px;color:var(--muted)}
#sheet p b{color:var(--ink)}
@media(min-width:900px){
  #sheet{left:auto;right:20px;bottom:20px;width:400px;border:1px solid var(--line);border-radius:14px;
    padding-bottom:16px}
}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:2px;
  background:rgba(12,10,20,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;background:none;border:0;border-radius:10px;padding:6px 1px;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
#tabs button b{font:600 14px/1 ui-monospace,Menlo,monospace}
#tabs button .tl{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#tabs button .ts{font-size:8.5px;color:var(--faint);white-space:nowrap}
#tabs button[aria-selected=true]{color:var(--ink);background:var(--panel2)}
#tabs button[aria-selected=true] b{color:var(--cyan)}
@media(min-width:900px){
  #tabs{left:50%;right:auto;transform:translateX(-50%);bottom:14px;border:1px solid var(--line);
    border-radius:14px;padding:6px}
  #tabs button{min-width:86px;padding:6px 8px}
}
#error{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:var(--bg);text-align:center;padding:24px}
#error[hidden]{display:none}
#error h1{font:700 22px Georgia,serif}
@media(prefers-reduced-motion:reduce){#panel,#sheet{transition:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="dots" aria-hidden="false"></div>

<header>
  <div class="wordmark">
    <h1>The Megawatt Path</h1>
    <div class="sub">from one switch to a campus &middot; drag to orbit &middot; pinch to zoom</div>
  </div>
  <div class="meters">
    <div class="chip">Scale <b id="m-scale">-</b></div>
    <div class="chip pow">Power <b id="m-pow">-</b></div>
  </div>
</header>

<div id="panel" role="region" aria-label="About this step">
  <div class="p-head">
    <span class="k" id="p-k">1/7</span>
    <h2 id="p-title">-</h2>
    <button class="min" id="p-min" aria-label="Hide panel">&minus;</button>
  </div>
  <div class="p-body" id="p-body"></div>
</div>
<button id="showpanel">About this step</button>

<div id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <button class="close" aria-label="Close">&#10005;</button>
  <h3 id="sheet-title"></h3>
  <div id="sheet-body"></div>
</div>

<nav id="tabs" aria-label="Steps"></nav>

<div id="error" hidden>
  <div><h1>This path needs WebGL.</h1>
  <p>Please open it in a browser with hardware acceleration enabled.</p></div>
</div>
