name: Deploy API to Railway

on:
  pull_request:
    branches: [master]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  push:
    branches: [master]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: railway-api-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: django
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Collect static files for admin rendering tests
        run: python manage.py collectstatic --noinput
      - name: Test local SQLite fallback
        run: python manage.py test
      - name: Migrate and test PostgreSQL
        env:
          DATABASE_URL: postgres://django:ci-only-password@localhost:5432/django?sslmode=disable
        run: |
          python manage.py migrate --settings=config.migration_settings --noinput
          python manage.py test
          python manage.py makemigrations --check --dry-run

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 79593d36-e4ba-406b-8f7e-51e9116a9c5a
          RAILWAY_ENVIRONMENT_ID: 41a544e7-4fae-4b89-8bdd-69abf384c83a
          RAILWAY_SERVICE_ID: 5b117cf2-e177-4951-ba3e-9b20c4920144
        run: >-
          railway up ./api --path-as-root --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
