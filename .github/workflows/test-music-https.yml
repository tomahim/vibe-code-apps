name: Private music HTTPS preparation (no deploy)
on:
  pull_request:
    branches: [master]
    paths:
      - "infra/music-https/**"
      - ".github/workflows/test-music-https.yml"
permissions:
  contents: read
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/music-https/test-config.py
      - run: sh -n infra/music-https/start.sh
      - run: docker build -t music-https-test infra/music-https
      - run: docker run --rm --entrypoint nginx music-https-test -t
      - run: python3 infra/music-https/test-proxy.py
      - name: Reject routing configuration before login
        run: |
          if docker run --rm -e TS_ROUTES=10.0.0.0/8 music-https-test; then exit 1; fi
          if docker run --rm -e TS_EXTRA_ARGS=--advertise-exit-node music-https-test; then exit 1; fi
          if docker run --rm music-https-test; then exit 1; fi
  music-playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: node infra/music-https/music-https-check.mjs
