name: Rust learning path checks
on:
  pull_request:
    branches: [master]
    paths:
      - 'ui/**'
      - 'api/apps/rust_learning_path/**'
      - '.github/workflows/test-rust.yml'
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'api/apps/rust_learning_path/**'
      - '.github/workflows/test-rust.yml'
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Install the pinned curriculum compiler
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - run: npm test
      - name: Check every starter and solution with real rustc
        run: npm run test:rust
