name: Deploy UI to Railway

on:
  pull_request:
    branches: [master]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-ui.yml"
  push:
    branches: [master]
    paths:
      - "ui/**"

permissions:
  contents: read

concurrency:
  group: railway-ui-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect browser-tested app changes
        if: github.event_name == 'pull_request'
        id: browser_apps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            src/apps/threejs-learning-path \
            src/apps/app-ideas \
            tests/browser/app-ideas.spec.js \
            scripts/build-sandbox.mjs \
            tests/browser/learning-path.spec.js \
            playwright.config.js)"
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate lessons and saved progress
        run: npm test
      - name: Test production proxy uploads
        run: npm run test:proxy
      - name: Build production UI
        run: npm run build
      - name: Install browser
        if: github.event_name == 'pull_request' && steps.browser_apps.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Test interactive apps in a browser
        if: github.event_name == 'pull_request' && steps.browser_apps.outputs.changed == 'true'
        run: npm run test:browser
      - name: Upload browser failure details
        if: failure() && github.event_name == 'pull_request' && steps.browser_apps.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-results
          path: ui/test-results/

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy UI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 79593d36-e4ba-406b-8f7e-51e9116a9c5a
          RAILWAY_ENVIRONMENT_ID: 41a544e7-4fae-4b89-8bdd-69abf384c83a
          RAILWAY_SERVICE_ID: 1561708c-0f17-4e8c-aef6-04c66bd26731
        run: >-
          railway up ./ui --path-as-root --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
