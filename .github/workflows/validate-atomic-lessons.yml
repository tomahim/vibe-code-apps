name: Atomic lessons content checks

on:
  pull_request:
    paths:
      - 'atomic-lessons/**'
      - '.github/workflows/validate-atomic-lessons.yml'
  push:
    paths:
      - 'atomic-lessons/**'
      - '.github/workflows/validate-atomic-lessons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uuids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the retirement gate reads the base revision's manifest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: atomic-lessons/requirements.txt
      - name: Install the YAML parser
        run: python -m pip install -r atomic-lessons/requirements.txt
      - name: Test the content checkers
        run: python -m unittest discover -s atomic-lessons -p 'test_*.py'
      - name: Require globally unique UUIDv4 IDs on every content element
        run: python atomic-lessons/check_uuids.py
      - name: Validate card illustrations
        run: python atomic-lessons/check_images.py
      - name: Reject removal of existing content IDs
        # Content is retired with `archived: true`, never by deleting its ID.
        run: python atomic-lessons/check_retired_ids.py
