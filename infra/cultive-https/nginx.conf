worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    # Resolve the fixed Railway backend per request, including after sleep/wake.
    resolver [fd12::10] ipv6=off valid=5s;
    resolver_timeout 2s;
    server {
        listen 127.0.0.1:18080;
        server_name _;
        location / {
            set $backend http://cultive-dev.railway.internal:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # This listener is reachable only from local Serve. Never trust a
            # user-supplied scheme or Tailscale identity as application auth.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            client_max_body_size 6m;
        }
    }
}
